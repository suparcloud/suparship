name: cleanup-pr-image

# When a PR is closed (merged or not), delete its pr-<n> image from GHCR.

on:
  pull_request:
    types: [closed]

permissions:
  contents: read
  packages: write

jobs:
  delete:
    name: Delete pr-${{ github.event.pull_request.number }} image
    runs-on: ubuntu-latest
    # Only same-repo PRs publish images, so only those need cleanup.
    if: github.event.pull_request.head.repo.full_name == github.repository
    steps:
      - name: Delete image tag
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          OWNER: ${{ github.repository_owner }}
          PACKAGE: ${{ github.event.repository.name }}
          PR: ${{ github.event.pull_request.number }}
        run: |
          set -euo pipefail
          TAG="pr-${PR}"

          OWNER_TYPE=$(gh api "/users/${OWNER}" --jq .type)
          if [ "$OWNER_TYPE" = "Organization" ]; then
            BASE="/orgs/${OWNER}/packages/container/${PACKAGE}/versions"
          else
            BASE="/users/${OWNER}/packages/container/${PACKAGE}/versions"
          fi

          IDS=$(gh api --paginate "$BASE" \
            --jq ".[] | select(.metadata.container.tags | index(\"${TAG}\")) | .id")

          if [ -z "$IDS" ]; then
            echo "No image tagged ${TAG}; nothing to delete."
            exit 0
          fi

          for ID in $IDS; do
            echo "Deleting version ${ID} (tag: ${TAG})"
            gh api -X DELETE "${BASE}/${ID}"
          done
