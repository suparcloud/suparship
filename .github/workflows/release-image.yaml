name: release-image

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  # Escape hatch: when release-please pushes the tag with GITHUB_TOKEN rather
  # than a PAT, the tag push starts no workflow run. Dispatch this against the
  # release tag to build the versioned image by hand.
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: release-image-${{ github.ref }}
  cancel-in-progress: true

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  changes:
    name: Detect image-relevant changes
    runs-on: ubuntu-latest
    outputs:
      relevant: ${{ steps.filter.outputs.relevant }}
    steps:
      - uses: actions/checkout@v4
      - uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            relevant:
              - 'cmd/**'
              - 'internal/**'
              - 'ui/**'
              - 'go.mod'
              - 'go.sum'
              - 'Dockerfile'
              - '.dockerignore'
              - '.github/workflows/release-image.yaml'

  build:
    name: Build and push
    needs: changes
    # Tag pushes always build — releases must be cut even when the tag
    # points at an already-pushed commit (zero changed files in the push
    # event). Branch and PR builds only run when an image input actually
    # changed.
    if: |
      startsWith(github.ref, 'refs/tags/v') ||
      needs.changes.outputs.relevant == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # Full history so the build args carry a meaningful commit/version.
          fetch-depth: 0

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v3

      # Forks can't access secrets, so skip login (and push) for fork PRs.
      - name: Log in to GHCR
        if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Compute image tags
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            # Tag pushes (v1.2.3) → 1.2.3, 1.2, 1
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=semver,pattern={{major}}
            # Releases → latest. `latest` must mean "newest RELEASE", not "tip
            # of main" — an operator running `docker pull …:latest` should get
            # a released build, not whatever merged an hour ago.
            type=raw,value=latest,enable=${{ startsWith(github.ref, 'refs/tags/v') }}
            # main branch → edge + main-<short-sha>
            type=raw,value=edge,enable={{is_default_branch}}
            type=sha,prefix=main-,enable={{is_default_branch}}
            # Pull requests → pr-<n> (default behaviour of type=ref,event=pr)
            type=ref,event=pr

      - name: Build date
        id: date
        run: echo "date=$(date -u +%Y-%m-%dT%H:%M:%SZ)" >> "$GITHUB_OUTPUT"

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile
          # Multi-arch on push events; PRs build amd64-only to save CI minutes.
          platforms: ${{ github.event_name == 'pull_request' && 'linux/amd64' || 'linux/amd64,linux/arm64' }}
          # Push on main/tags, and on same-repo PRs. Fork PRs build only.
          push: ${{ github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            VERSION=${{ steps.meta.outputs.version }}
            COMMIT=${{ github.sha }}
            DATE=${{ steps.date.outputs.date }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
