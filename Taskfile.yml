# https://taskfile.dev
version: "3"

# Load .env automatically so all tasks pick up local dev settings.
dotenv: ['.env']

vars:
  BINARY_NAME: suparship

tasks:
  default:
    desc: Show available tasks
    silent: true
    cmds:
      - task --list

  # ── Local (fake / in-memory) dev ───────────────────────────────────────
  # No cluster required. Uses in-memory data and a fixed admin credential.

  dev:
    desc: "Start local dev — backend (fake/in-memory) + frontend"
    cmds:
      - hack/dev.sh

  dev:api:
    desc: "Build and start the backend API only (fake mode)"
    cmds:
      - go build -o bin/{{.BINARY_NAME}} ./cmd/suparship
      - SUPARSHIP_CORS_ORIGINS=http://localhost:5173 ./bin/{{.BINARY_NAME}} server

  dev:ui:
    desc: "Start the frontend Vite dev server only"
    cmds:
      - cd ui && npm run dev

  # ── Cluster dev — main entry points ────────────────────────────────────
  # Run dev:cluster once to provision the cluster, then dev:cluster:serve
  # for every subsequent dev session (fast build + restart, no cluster touch).

  dev:cluster:
    desc: "Set up dev cluster — DNS + bootstrap + ingress + ArgoCD + Gitea + gitops-init + seed + cert-manager + Argo Rollouts + Kargo + Replicator + Reloader (idempotent)"
    cmds:
      - hack/setup-cluster.sh

  dev:cluster:serve:
    desc: "Start backend (cluster mode) + frontend against the running dev cluster"
    cmds:
      - hack/serve-cluster.sh

  dev:cluster:delete:
    desc: "Tear down the suparShip dev cluster"
    cmds:
      - |
        kind delete cluster --name suparship-dev \
          && echo "  Cluster deleted." \
          || echo "  Cluster 'suparship-dev' not found — nothing to delete."

  # ── Cluster dev — individual component installs (targeted re-runs) ──────

  dev:cluster:dns:
    desc: "Set up wildcard *.localhost DNS via dnsmasq — macOS only, run once per machine"
    cmds:
      - hack/setup-dns.sh

  dev:cluster:bootstrap:
    desc: "Create kind cluster + namespaces (idempotent)"
    cmds:
      - hack/bootstrap-cluster.sh

  dev:cluster:ingress:
    desc: "Install NGINX ingress controller"
    cmds:
      - hack/install-ingress.sh

  dev:cluster:argocd:
    desc: "Install minimal ArgoCD (dev profile)"
    cmds:
      - hack/install-argocd.sh

  dev:cluster:cert-manager:
    desc: "Install cert-manager (dev profile) — required by Kargo for TLS certificates"
    cmds:
      - hack/install-cert-manager.sh

  dev:cluster:argo-rollouts:
    desc: "Install Argo Rollouts (dev profile) — required by Kargo for progressive delivery"
    cmds:
      - hack/install-argo-rollouts.sh

  dev:cluster:kargo:
    desc: "Install cert-manager + Argo Rollouts + Kargo via OCI chart (dev profile)"
    deps: [dev:cluster:cert-manager, dev:cluster:argo-rollouts]
    cmds:
      - hack/install-kargo.sh

  dev:cluster:replicator:
    desc: "Install Stakater Replicator — replicates upper-level env ConfigMaps/Secrets across namespaces"
    cmds:
      - hack/install-replicator.sh

  dev:cluster:reloader:
    desc: "Install Stakater Reloader — triggers rolling restarts when ConfigMaps or Secrets change"
    cmds:
      - hack/install-reloader.sh

  dev:cluster:registry:
    desc: "Set up a local container registry (kind-registry on localhost:5001)"
    cmds:
      - hack/install-registry.sh

  dev:cluster:gitea:
    desc: "Install Gitea + create gitops repo + register with ArgoCD"
    cmds:
      - hack/install-gitea.sh

  dev:cluster:gitops-init:
    desc: "Re-push gitops repo skeleton to Gitea (charts + gitops-output)"
    env:
      GITEA_HOST_URL: '{{default "http://gitea.localhost:8880" .GITEA_HOST_URL}}'
      GITEA_ADMIN_USER: '{{default "gitops" .GITEA_ADMIN_USER}}'
      GITEA_ADMIN_PASS: '{{default "gitops-dev-only" .GITEA_ADMIN_PASS}}'
      GITOPS_REPO_ORG: '{{default "gitops" .GITOPS_REPO_ORG}}'
      GITOPS_REPO_NAME: '{{default "gitops" .GITOPS_REPO_NAME}}'
      GITEA_CLUSTER_URL: '{{default "http://gitea-http.gitea.svc.cluster.local:3000" .GITEA_CLUSTER_URL}}'
      REPO_ROOT: '{{.ROOT_DIR}}'
    cmds:
      - hack/init-gitops-repo.sh

  dev:cluster:seed:
    desc: "Seed demo data into the cluster (org, project, preview) — idempotent"
    cmds:
      - hack/seed.sh

  dev:cluster:reset:
    desc: "Remove seeded demo ConfigMaps from the cluster (re-seedable)"
    cmds:
      - hack/reset-cluster.sh

  dev:cluster:seed-color-app:
    desc: "Seed color-app demo via the suparShip API (requires running server)"
    cmds:
      - hack/seed-color-app.sh

  dev:cluster:init-color-app-repo:
    desc: "Push color-app source code to a Gitea repo (demo/color-app)"
    cmds:
      - hack/init-color-app-repo.sh

  # ── Demo ───────────────────────────────────────────────────────────────

  demo:deploy:
    desc: "Deploy the hello demo app (nginx) to the kind cluster via GitOps"
    cmds:
      - hack/deploy-demo-app.sh

  demo:color-app:build:
    desc: "Build the color-app demo image (VERSION=0.1.0, COLOR=blue)"
    vars:
      VERSION: '{{default "0.1.0" .VERSION}}'
      COLOR: '{{default "blue" .COLOR}}'
    cmds:
      - |
        docker build \
          --build-arg VERSION={{.VERSION}} \
          --build-arg COLOR={{.COLOR}} \
          -t localhost:5001/demo/color-app:{{.VERSION}} \
          demo/color-app
        echo "  Built: localhost:5001/demo/color-app:{{.VERSION}} (color={{.COLOR}})"

  demo:color-app:push:
    desc: "Push the color-app image to the local registry (VERSION=0.1.0)"
    vars:
      VERSION: '{{default "0.1.0" .VERSION}}'
    cmds:
      - |
        docker push localhost:5001/demo/color-app:{{.VERSION}}
        echo "  Pushed: localhost:5001/demo/color-app:{{.VERSION}}"

  demo:color-app:release:
    desc: "Build + push color-app in one step (VERSION=0.1.0, COLOR=blue)"
    vars:
      VERSION: '{{default "0.1.0" .VERSION}}'
      COLOR: '{{default "blue" .COLOR}}'
    cmds:
      - task: demo:color-app:build
        vars: { VERSION: "{{.VERSION}}", COLOR: "{{.COLOR}}" }
      - task: demo:color-app:push
        vars: { VERSION: "{{.VERSION}}" }

  # ── Build & test ───────────────────────────────────────────────────────

  build:
    desc: "Build the suparship binary"
    cmds:
      - go build -o bin/{{.BINARY_NAME}} ./cmd/suparship

  test:
    desc: "Run all Go tests"
    cmds:
      - go test -race ./...

  reset:
    desc: "Clean local build artifacts (bin/, tmp/)"
    cmds:
      - |
        rm -rf bin/ tmp/
        echo "  Removed: bin/  tmp/"
        echo "  To also clean the frontend build:  rm -rf ui/dist/"
        echo "  To reset cluster seed data:        task dev:cluster:reset"
