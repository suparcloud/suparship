# https://taskfile.dev
version: "3"

# Load .env automatically so all tasks pick up local dev settings.
dotenv: ['.env']

vars:
  BINARY_NAME: suparship

tasks:
  default:
    desc: Show available tasks
    silent: true
    cmds:
      - task --list

  # ── Local (fake / in-memory) dev ───────────────────────────────────────
  # No cluster required. Uses in-memory data and a fixed admin credential.

  dev:
    desc: "Start local dev — backend (fake/in-memory) + frontend"
    cmds:
      - hack/dev.sh

  dev:api:
    desc: "Build and start the backend API only (fake mode)"
    cmds:
      - go build -o bin/{{.BINARY_NAME}} ./cmd/suparship
      - SUPARSHIP_CORS_ORIGINS=http://localhost:5173 ./bin/{{.BINARY_NAME}} server

  dev:ui:
    desc: "Start the frontend Vite dev server only"
    cmds:
      - cd ui && npm run dev

  # ── Tilt cluster dev (recommended) ─────────────────────────────────────
  # One command: ctlptl cluster + local registry, all prerequisites, and
  # suparship deployed in-cluster with hot-reload. See docs/contributor-guide/
  # hacking-on-suparship.md.

  up:
    desc: "Start the full dev cluster with Tilt — cluster + ingress (*.localhost) + Vault + registries + suparship (hot-reload). Tilt UI: http://localhost:10350"
    cmds:
      - hack/preflight.sh tilt
      - ctlptl apply -f hack/dev/cluster.yaml
      - 'echo "Endpoints once resources go green (also on the endpoints resource in the Tilt UI):"'
      - hack/dev/endpoints.sh
      - tilt up

  up:lean:
    desc: "Like `task up` but without Vault and ingress (org backend = deprecated k8s; leanest loop)"
    cmds:
      - hack/preflight.sh tilt
      - ctlptl apply -f hack/dev/cluster.yaml
      - 'echo "Endpoints once resources go green (also on the endpoints resource in the Tilt UI):"'
      - SUPARSHIP_VAULT=0 SUPARSHIP_INGRESS=0 hack/dev/endpoints.sh
      - tilt up -- --no-vault --no-ingress

  up:ingress:
    desc: "DEPRECATED alias of `task up` — ingress is on by default now"
    cmds:
      - task: up

  up:vault:
    desc: "DEPRECATED alias of `task up` — Vault is the default secrets backend now"
    cmds:
      - task: up

  up:multi:
    desc: "Like `task up`, plus kind-staging + kind-prod workload clusters (real multi-cluster; ~+2 GiB RAM)"
    cmds:
      - hack/preflight.sh tilt
      - ctlptl apply -f hack/dev/cluster.yaml
      - ctlptl apply -f hack/dev/clusters-workload.yaml
      # ctlptl points the current context at whatever it created LAST, which
      # here is a workload cluster — and the Tiltfile refuses to load unless the
      # context is the tooling cluster. Switch back explicitly.
      - kubectl config use-context kind-suparship-dev
      - 'echo "Endpoints once resources go green (also on the endpoints resource in the Tilt UI):"'
      - hack/dev/endpoints.sh
      - tilt up -- --multi

  down:
    desc: "Stop Tilt and remove the in-cluster workloads (keeps the cluster running)"
    cmds:
      - tilt down

  cluster:delete:
    desc: "Delete the dev clusters + local registry (ctlptl) — tooling and, if present, the workload clusters"
    cmds:
      # Workload clusters first: they are optional, so ignore a missing-cluster
      # error rather than failing the teardown of the tooling cluster.
      - ctlptl delete -f hack/dev/clusters-workload.yaml --ignore-not-found
      - ctlptl delete -f hack/dev/cluster.yaml

  # ── Cluster helpers ────────────────────────────────────────────────────
  # Prerequisite installs (cert-manager, Argo Rollouts, Kargo, ArgoCD, Gitea,
  # ESO, Replicator, Reloader) are declared ONCE in the Tiltfile as
  # helm_resource blocks — namespace, pinned version and ordering all live
  # there. `task up` is the entry point. The tasks below are the bits Tilt
  # does not own.

  dev:dns:
    desc: "Wildcard *.localhost → 127.0.0.1, once per machine (no-op where it already resolves; macOS + Ubuntu/Debian + RHEL/Fedora)"
    cmds:
      - hack/setup-dns.sh

  gitops:init:
    desc: "Re-push gitops repo skeleton to Gitea (charts + gitops-output)"
    env:
      GITEA_HOST_URL: '{{default "http://localhost:3000" .GITEA_HOST_URL}}'
      GITEA_ADMIN_USER: '{{default "gitops" .GITEA_ADMIN_USER}}'
      GITEA_ADMIN_PASS: '{{default "gitops-dev-only" .GITEA_ADMIN_PASS}}'
      GITOPS_REPO_ORG: '{{default "gitops" .GITOPS_REPO_ORG}}'
      GITOPS_REPO_NAME: '{{default "gitops" .GITOPS_REPO_NAME}}'
      GITEA_CLUSTER_URL: '{{default "http://gitea-http.gitea.svc.cluster.local:3000" .GITEA_CLUSTER_URL}}'
      REPO_ROOT: '{{.ROOT_DIR}}'
    cmds:
      - hack/init-gitops-repo.sh

  seed:
    desc: "Seed demo data into the dev cluster (org, project, preview) — idempotent"
    cmds:
      - hack/seed.sh

  seed:reset:
    desc: "Remove seeded demo ConfigMaps from the dev cluster (re-seedable)"
    cmds:
      - hack/reset-cluster.sh

  # ── Demo ───────────────────────────────────────────────────────────────

  demo:shipnotes:
    desc: "One command → working demo: mirror suparship-demo into Gitea, CI to the local registry, composed app (frontend+api+db) deployed to staging with previews + promotion wired"
    cmds:
      - hack/dev/demo-shipnotes.sh

  # ── Build & test ───────────────────────────────────────────────────────

  build:
    desc: "Build the suparship binary"
    cmds:
      - go build -o bin/{{.BINARY_NAME}} ./cmd/suparship

  test:
    desc: "Run all Go tests"
    cmds:
      - go test -race ./...

  # ── Charts ─────────────────────────────────────────────────────────────
  # The catalog is examples/charts/ — plain BYO Helm charts (see
  # examples/charts/README.md). charts:verify asserts the platform contract
  # against each chart's ci/platform-values.yaml.

  charts:lint:
    desc: "helm lint every examples/charts/<name> and the platform chart"
    cmds:
      - |
        set -e
        for c in examples/charts/*/; do
          helm lint "$c"
        done
      - helm lint charts/suparship

  charts:verify:
    desc: "CI guard: lint + default render + platform-contract render assertions for examples/charts. Use in CI."
    cmds:
      - hack/charts-verify.sh

  reset:
    desc: "Clean local build artifacts (bin/, tmp/)"
    cmds:
      - |
        rm -rf bin/ tmp/
        echo "  Removed: bin/  tmp/"
        echo "  To also clean the frontend build:  rm -rf ui/dist/"
        echo "  To reset cluster seed data:        task seed:reset"
