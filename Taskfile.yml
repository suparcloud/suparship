# https://taskfile.dev
version: "3"

# Load .env automatically when present so all tasks pick up local dev settings.
dotenv: ['.env']

vars:
  BINARY_NAME: suparship

tasks:
  default:
    desc: Show available tasks
    cmds:
      - task --list

  help:
    desc: Show available tasks
    cmds:
      - task --list

  # ── Local development ──────────────────────────────────────────────────

  dev:
    desc: "Start local dev: backend (fake/in-memory) + frontend — one command"
    cmds:
      - hack/dev.sh

  dev:api:
    desc: "Build and start the backend API only (fake/local mode)"
    cmds:
      - go build -o bin/{{.BINARY_NAME}} ./cmd/suparship
      - SUPARSHIP_CORS_ORIGINS=http://localhost:5173 ./bin/{{.BINARY_NAME}} server

  dev:ui:
    desc: "Start the frontend Vite dev server only"
    cmds:
      - cd ui && npm run dev

  dev:cluster:
    desc: Create a local k3d cluster for development
    cmds:
      - |
        echo "Prerequisites: k3d (https://k3d.io) + docker"
        echo "This task will provision a k3d cluster with ingress in a future commit."

  # ── Testing ────────────────────────────────────────────────────────────

  test:
    desc: Run all Go tests
    cmds:
      - go test -race ./...

  # ── Data management ────────────────────────────────────────────────────

  seed:
    desc: Seed demo data (org, project, environments, service)
    cmds:
      - |
        echo "Seeding requires a running cluster."
        echo "Implementation coming in a future commit."

  reset:
    desc: Reset local dev environment (cluster + data)
    cmds:
      - |
        echo "Reset implementation coming in a future commit."
