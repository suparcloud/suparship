apiVersion: argoproj.io/v1alpha1
kind: ApplicationSet
metadata:
  name: voiceai-livekit-canary-lk-kam-prod
  namespace: argocd
spec:
  generators:
    - clusters:
        selector:
          matchLabels:
            enabled: "true"
            env: prod
        values:
          branch: main
  template:
    metadata:
      name: 'voiceai-livekit-canary-lk-kam-{{name}}'
      annotations:
        argocd.argoproj.io/sync-wave: "1"
    spec:
      project: "{{metadata.labels.env}}-voiceai"
      source:
        repoURL: git@github.com:Bigly-Sales/biglysales-voiceai-livekit.git
        path: deploy/kustomize/canary-livekit-kam/overlays/{{metadata.labels.env}}
        targetRevision: '{{values.branch}}'
      destination:
        server: '{{server}}'
        namespace: voiceai
      syncPolicy:
        automated:
          enabled: true
          prune: true
          selfHeal: true
        syncOptions:
          - CreateNamespace=true
          - Replace=false
          - PrunePropagationPolicy=foreground
          - PruneLast=true
          - ServerSideApply=true
          - SkipDryRunOnMissingResource=true
          - RespectIgnoreDifferences=true
          - ApplyOutOfSyncOnly=true
        retry:
          limit: 5
          backoff:
            duration: 5s
            factor: 2
            maxDuration: 3m
