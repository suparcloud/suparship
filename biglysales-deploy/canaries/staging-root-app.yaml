apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: voiceai-livekit-canary-staging-root-application
  namespace: argocd
spec:
  project: apps
  source:
    repoURL: git@github.com:Bigly-Sales/biglysales-voiceai-livekit.git
    targetRevision: staging
    path: deploy/canaries/staging
  destination:
    server: https://kubernetes.default.svc
    namespace: argocd
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
