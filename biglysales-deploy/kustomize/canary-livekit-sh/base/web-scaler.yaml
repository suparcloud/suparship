apiVersion: keda.sh/v1alpha1
kind: ScaledObject
metadata:
  name: voiceai-web-scaler-canary-lk-sh
spec:
  scaleTargetRef:
    kind: Deployment
    name: voiceai-livekit-web-canary-lk-sh
  minReplicaCount: 2
  maxReplicaCount: 10
  triggers:
    - type: cpu
      metricType: Utilization # Allowed types are 'Utilization' or 'AverageValue'
      metadata:
        value: "65"
    - type: memory
      metricType: Utilization # Allowed types are 'Utilization' or 'AverageValue'
      metadata:
        value: "95"
  cooldownPeriod: 300
  advanced:
    horizontalPodAutoscalerConfig:
      behavior:
        scaleDown:
          stabilizationWindowSeconds: 300
          policies:
          - type: Pods
            value: 1
            periodSeconds: 60
        scaleUp:
          stabilizationWindowSeconds: 60
          policies:
          - type: Pods
            value: 1
            periodSeconds: 30
