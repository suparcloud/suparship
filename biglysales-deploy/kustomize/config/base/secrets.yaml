---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: voiceai-livekit-env
spec:
  refreshInterval: 1m
  secretStoreRef:
    kind: ClusterSecretStore
    name: onepassword-connect-voiceai
  target:
    name: voiceai-livekit-env  # name of the k8s Secret to be created
    creationPolicy: Owner
  dataFrom:
    - extract:
        key: voiceai-livekit-env
