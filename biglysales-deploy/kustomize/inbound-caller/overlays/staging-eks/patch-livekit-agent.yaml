---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: voiceai-livekit-agent-server-inbound-caller
spec:
  template:
    spec:
      containers:
      - name: voiceai-livekit-agent-server
        env:
        - name: MAX_AGENTS
          value: "10"
        - name: AG__NUM_IDLE_PROCESSES
          value: "10"
        - name: VALKEY_INTERNAL_URL
          value: "redis://livekit-redis.internal.aws.biglysalesstaging.com:6379/0"
        envFrom:
        - secretRef:
            name: voiceai-livekit-env
        - secretRef:
            name: voiceai-livekit-self-hosted-env
---
apiVersion: keda.sh/v1alpha1
kind: ScaledObject
metadata:
  name: voiceai-livekit-agent-server-inbound-caller
spec:
  triggers:
    # Keep 1 pod capacity (10 slots) free on staging
    - type: prometheus
      metadata:
        serverAddress: http://kube-prometheus-stack-prometheus.monitoring.svc:9090
        query: max(lk1_active_dispatches{agent_server_type="bigly-inbound-caller", release_channel="default"}) + 10
        threshold: "10"
    - type: cpu
      metricType: Utilization
      metadata:
        value: "60"
