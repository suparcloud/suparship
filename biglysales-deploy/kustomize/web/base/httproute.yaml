# HTTPRoute for voiceai-livekit.azure.biglysales.com via Envoy Gateway (envoy external).
# Gateway and EnvoyProxy config live in kubernetes-platform; this HTTPRoute is owned by this repo.
# Staging: 100% main (livekit). Prod overlay patches hostname and weights (e.g. canary split).
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: voiceai-livekit-httproute
spec:
  parentRefs:
    - name: envoy-external
      namespace: envoy-gateway-system
      sectionName: https
  hostnames:
    - voiceai-livekit.azure.biglysalesstaging.com
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /
      backendRefs:
        # Staging: main only (canary not deployed in staging)
        - name: voiceai-livekit-web-service
          port: 8765
      timeouts:
        request: 60s
        backendRequest: 60s
