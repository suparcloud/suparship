# HTTPRoute for LiveKit cloud via Envoy Gateway (envoy external).
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: voiceai-livekit-cloud-httproute
spec:
  parentRefs:
    - name: envoy-external
      namespace: envoy-gateway-system
      sectionName: https
  hostnames:
    - voiceai-livekit-cloud.azure.biglysales.com
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /
      backendRefs:
        - name: voiceai-livekit-web-service
          port: 8765
          weight: 100
      timeouts:
        request: 60s
        backendRequest: 60s
