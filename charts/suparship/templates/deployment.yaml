apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "suparship.fullname" . }}
  namespace: {{ include "suparship.namespace" . }}
  labels:
    {{- include "suparship.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.replicaCount }}
  selector:
    matchLabels:
      {{- include "suparship.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      annotations:
        checksum/org-config: {{ include (print $.Template.BasePath "/configmap-org.yaml") . | sha256sum }}
        {{- with .Values.podAnnotations }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
      labels:
        {{- include "suparship.labels" . | nindent 8 }}
        {{- with .Values.podLabels }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
    spec:
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      serviceAccountName: {{ include "suparship.serviceAccountName" . }}
      {{- with .Values.podSecurityContext }}
      securityContext:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      containers:
        - name: suparship
          image: {{ include "suparship.image" . }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          args:
            - server
            - --addr=:8080
            - --ui-dir=/app/ui
            - --log-level={{ .Values.server.logLevel }}
            {{- if .Values.server.cookieSecure }}
            - --cookie-secure
            {{- end }}
            - --admin-secret-name={{ .Values.admin.secret.name }}
            - --admin-secret-namespace={{ default (include "suparship.namespace" .) .Values.admin.secret.namespace }}
            - --admin-secret-username-key={{ .Values.admin.secret.usernameKey }}
            - --admin-secret-password-hash-key={{ .Values.admin.secret.passwordHashKey }}
          ports:
            - name: http
              containerPort: 8080
              protocol: TCP
          env:
            - name: SUPARSHIP_CLUSTER_MODE
              value: kubernetes
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 5
            periodSeconds: 15
          readinessProbe:
            httpGet:
              path: /readyz
              port: http
            initialDelaySeconds: 3
            periodSeconds: 10
          {{- with .Values.securityContext }}
          securityContext:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          {{- with .Values.resources }}
          resources:
            {{- toYaml . | nindent 12 }}
          {{- end }}
      {{- with .Values.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
