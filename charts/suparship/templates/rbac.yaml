{{- if .Values.serviceAccount.create -}}
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: {{ include "suparship.fullname" . }}
  labels:
    {{- include "suparship.labels" . | nindent 4 }}
rules:
  - apiGroups: [""]
    resources: ["configmaps", "secrets", "namespaces", "services", "pods", "pods/log"]
    verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
  # services/proxy is a distinct RBAC resource from services: the credstore
  # fetches the sealed-secrets controller cert via the API-server Service
  # proxy (/api/v1/namespaces/<ns>/services/<svc>:<port>/proxy/v1/cert.pem),
  # the same path kubeseal --fetch-cert uses.
  - apiGroups: [""]
    resources: ["services/proxy"]
    verbs: ["get", "create"]
  # SealedSecrets: UI-submitted external-template-repo credentials are sealed
  # and applied as bitnami sealed-secrets CRs in suparship-system (never as
  # plaintext Secrets); the controller decrypts them into the read Secret.
  - apiGroups: ["bitnami.com"]
    resources: ["sealedsecrets"]
    verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
  - apiGroups: ["apps"]
    resources: ["deployments", "replicasets"]
    verbs: ["get", "list", "watch"]
  - apiGroups: ["networking.k8s.io"]
    resources: ["ingresses", "ingressclasses"]
    verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
  - apiGroups: ["argoproj.io"]
    resources: ["applications", "applicationsets", "appprojects"]
    verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
  - apiGroups: ["kargo.akuity.io"]
    resources: ["stages", "freights", "warehouses", "promotions", "projects"]
    verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
  # Kargo v1.x authorizes Promotion creation via a SubjectAccessReview for the
  # virtual "promote" verb on the target Stage. This is NOT covered by the
  # standard verbs above, so without it the promotion admission webhook denies
  # the request: "subject ... is not permitted to create Promotions for Stage".
  - apiGroups: ["kargo.akuity.io"]
    resources: ["stages"]
    verbs: ["promote"]
  # CreatePromotion approves the resolved Freight for the target Stage by
  # patching the Freight's status; status is a distinct RBAC subresource.
  - apiGroups: ["kargo.akuity.io"]
    resources: ["freights/status"]
    verbs: ["patch"]
  - apiGroups: ["external-secrets.io"]
    resources: ["externalsecrets", "clustersecretstores", "secretstores"]
    verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: {{ include "suparship.fullname" . }}
  labels:
    {{- include "suparship.labels" . | nindent 4 }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: {{ include "suparship.fullname" . }}
subjects:
  - kind: ServiceAccount
    name: {{ include "suparship.serviceAccountName" . }}
    namespace: {{ include "suparship.namespace" . }}
---
# ── External Secrets Operator reader ──────────────────────────────────────
# The k8s secret backend stores each scope's secrets in its own namespace
# (suparship-secrets-global / -env-<env>; cluster-override items live inside
# the env namespace), created on demand by the suparship server. The generated
# ClusterSecretStores read those namespaces by impersonating this
# ServiceAccount, so it needs cluster-wide read on Secrets (the vault
# namespaces are dynamic and cannot be enumerated here). Scoped to read-only
# on Secrets and used exclusively by ESO.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: suparship-eso-reader
  namespace: {{ include "suparship.namespace" . }}
  labels:
    {{- include "suparship.labels" . | nindent 4 }}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: {{ include "suparship.fullname" . }}-eso-reader
  labels:
    {{- include "suparship.labels" . | nindent 4 }}
rules:
  - apiGroups: [""]
    resources: ["secrets"]
    verbs: ["get", "list", "watch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: {{ include "suparship.fullname" . }}-eso-reader
  labels:
    {{- include "suparship.labels" . | nindent 4 }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: {{ include "suparship.fullname" . }}-eso-reader
subjects:
  - kind: ServiceAccount
    name: suparship-eso-reader
    namespace: {{ include "suparship.namespace" . }}
{{- end }}
