apiVersion: v1
kind: Service
metadata:
  name: {{ include "suparship.fullname" . }}
  namespace: {{ include "suparship.namespace" . }}
  labels:
    {{- include "suparship.labels" . | nindent 4 }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: http
      protocol: TCP
      name: http
  selector:
    {{- include "suparship.selectorLabels" . | nindent 4 }}
