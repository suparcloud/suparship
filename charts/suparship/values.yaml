# -- suparship Helm chart values
# See https://github.com/suparcloud/suparship for documentation.

# -- Container image settings
image:
  repository: ghcr.io/suparcloud/suparship
  # -- Overrides the image tag. Defaults to the chart appVersion.
  tag: ""
  pullPolicy: IfNotPresent

imagePullSecrets: []
nameOverride: ""
fullnameOverride: ""

# -- Number of replicas (suparship is stateless; >1 requires shared session store)
replicaCount: 1

serviceAccount:
  # -- Whether to create a ServiceAccount
  create: true
  # -- Annotations for the ServiceAccount
  annotations: {}
  # -- Override the ServiceAccount name
  name: ""

podAnnotations: {}
podLabels: {}

podSecurityContext: {}

securityContext: {}

# -- Server configuration
server:
  # -- Log level: debug, info, warn, error
  logLevel: info
  # -- Set Secure flag on session cookies (enable behind HTTPS)
  cookieSecure: false

service:
  type: ClusterIP
  port: 80

ingress:
  enabled: false
  className: ""
  annotations: {}
  host: suparship.example.com
  tls: []

resources: {}

nodeSelector: {}
tolerations: []
affinity: {}

# ---------------------------------------------------------------------------
# ArgoCD integration
# ---------------------------------------------------------------------------

# -- ArgoCD settings
argocd:
  # -- Namespace where ArgoCD is installed on the tooling cluster.
  # The suparship-system AppProject is created in this namespace.
  namespace: argocd
  # -- Whether to create the suparship-system ArgoCD AppProject during Helm
  # install/upgrade. Set to false if you manage AppProjects externally or if
  # suparship is installed in a cluster where ArgoCD is not present.
  createSystemProject: true

# ---------------------------------------------------------------------------
# Prerequisite acknowledgements
#
# These do NOT install anything — this chart deploys suparship only, and the
# reasoning is in Chart.yaml. They tell the pre-install prereq-check Job that a
# component is being installed alongside this release (or is otherwise on its
# way), so it should not fail the install for a component it cannot see yet.
#
# Leave false when the prerequisite is already present: the Job then verifies
# it and fails loudly if it is missing, which is what you want.
# ---------------------------------------------------------------------------
dependencies:
  # Skip the hard ArgoCD assertion (ns/argocd + deploy/argocd-server).
  argocd:
    enabled: false
  # Skip the External Secrets assertion, which is only enforced when
  # secrets.backend is "1password".
  eso:
    enabled: false
  # Reserved: the ingress check is advisory (warns, never fails).
  ingressNginx:
    enabled: false

# ---------------------------------------------------------------------------
# Onboarding configuration
# ---------------------------------------------------------------------------

# -- Organization settings
org:
  name: default
  displayName: "My Organization"

# -- Admin credentials. The chart does NOT create the Secret — provision it
# externally (manually, via SealedSecrets / External Secrets, included via
# extraObjects below, etc.) before installing, or run
# `kubectl exec deploy/<release> -- suparship admin bootstrap` after install
# to generate one.
admin:
  secret:
    # -- Secret name. Default matches `suparship admin bootstrap` output.
    name: suparship-admin-auth
    # -- Namespace. Empty defaults to the chart release namespace.
    namespace: ""
    # -- Secret key holding the username string.
    usernameKey: username
    # -- Secret key holding the bcrypt-hashed password.
    passwordHashKey: password-hash

# -- OIDC single sign-on (SSO). Configured in the UI under Settings → Auth, or
# declaratively here. The client secret is NEVER stored in config — it lives in
# a Kubernetes Secret referenced by clientSecretRef (provision it separately).
auth:
  oidc:
    # -- Turn the SSO login flow on.
    enabled: false
    # -- OIDC issuer URL (discovery at issuerURL/.well-known/openid-configuration).
    issuerURL: ""
    # -- OAuth2 client ID registered with the IdP.
    clientID: ""
    # -- suparship's callback URL registered with the IdP.
    redirectURL: ""
    # -- Secret + key holding the OAuth2 client secret.
    clientSecretRef:
      name: suparship-oidc
      key: client-secret
    # -- ID-token scopes requested at login.
    scopes: [openid, profile, email, groups]
    # -- ID-token claim used as the suparship username.
    usernameClaim: email
    # -- ID-token claim carrying IdP groups, matched against roleBindings[].group.
    groupsClaim: groups

# -- Teams: named groups of local users (matched by username). Used by
# roleBindings below. Configured in the UI under Settings → Teams.
teams: []
# Example:
# - name: platform
#   displayName: Platform
#   members: [alice, bob]

# -- Role bindings grant a role on a project to a team (local users) OR an IdP
# group (SSO). project "*" matches all projects. Roles: org_admin,
# project_admin, developer, viewer. Set exactly one of team/group.
roleBindings: []
# Example:
# - project: "*"
#   team: platform
#   role: org_admin
# - project: api
#   group: api-developers
#   role: developer

# -- GitOps repository connection
gitops:
  # -- Git provider: github, gitlab, bitbucket, gitea, generic
  provider: ""
  # -- Repository URL (HTTPS or SSH)
  repoURL: ""
  # -- Branch to use
  branch: main
  # -- Optional subpath within the repo for gitops content
  subPath: ""
  # -- Git author name for commits suparship makes (empty = "suparship")
  commitAuthorName: ""
  # -- Git author email for commits suparship makes (empty = "suparship@suparcloud.io")
  commitAuthorEmail: ""
  # -- Initialize repo structure on first boot when true
  initializeRepo: true
  # -- ISO 8601 timestamp when the credential expires (for health warnings)
  credentialExpiresAt: ""
  # -- Name of an existing Secret containing provider credentials.
  # Required keys vary by provider:
  #   github:    token (PAT) or appId + installationId + privateKey (App)
  #   gitlab:    token
  #   bitbucket: username + appPassword
  #   gitea:     token
  #   generic:   username + password
  #   ssh:       privateKey
  existingSecret: ""
  # -- Provider-specific non-secret fields
  github:
    appId: ""
    installationId: ""
  bitbucket:
    workspace: ""
  # -- ArgoCD-facing repo URL (if different from repoURL, e.g. in-cluster URL)
  argoCDRepoURL: ""
  # -- Kargo HTTPS repo URL (if different from repoURL)
  kargoGitRepoURL: ""

# -- Environments define the promotion pipeline.
# Bind each one to registered clusters with `clusterRefs` (a list) plus
# `activeClusterRef` (which member receives deploys). An environment with no
# clusterRefs is UNBOUND and nothing will deploy to it.
# `clusterRef` (singular) is still accepted as a deprecated alias.
# Set `deployMode: all` to fan out to every clusterRef instead of just the active one.
environments: []
# Example:
# - name: staging
#   displayName: Staging
#   order: 1
#   clusterRefs: [in-cluster]
#   activeClusterRef: in-cluster
#   baseDomain: staging.example.com
#   namespacePattern: "{app}-{env}"
# - name: prod
#   displayName: Production
#   order: 2
#   clusterRefs: [prod-aks, prod-eks]
#   activeClusterRef: prod-aks
#   # deployMode: "active" (default — deploy to activeClusterRef only) or
#   # "all" (fan out to every clusterRef — one Application per cluster).
#   deployMode: all
#   baseDomain: prod.example.com
#   namespacePattern: "{app}-{env}"

# -- Workload clusters to pre-register (METADATA ONLY).
#
# Entries here create the cluster record so ArgoCD can deploy to `apiServer`.
# They do NOT create the kubeconfig Secret, so suparship cannot reach these
# clusters for pod logs, live status, or sealed-secrets certs — all of which go
# through the kubeconfig in Secret `suparship-cluster-kubeconfig-{name}`.
#
# For a fully-functional cluster, register it through the UI, the API, or:
#   suparship cluster add --name prod-aks --api-server https://… --kubeconfig ./kc.yaml
# which writes the record, the kubeconfig Secret, and the ArgoCD cluster Secret
# together. Use this list for bootstrapping/GitOps-managed installs where you
# add credentials separately.
clusters: []
# Example:
# - name: in-cluster
#   displayName: "Local Cluster"
#   apiServer: https://kubernetes.default.svc
# - name: prod-aks
#   displayName: Production (Azure)
#   apiServer: https://prod-aks.example.com
#   # Per-cluster routing (multi-cloud): this cluster's own DNS zone + ingress.
#   # Overrides env → org routing for apps deployed here. baseDomain is the
#   # default zone; per-mode profiles refine ingress class / issuer / domain.
#   baseDomain: azure.example.com
#   routingProfiles:
#     external:
#       ingressClassName: webapprouting.kubernetes.azure.com
#       clusterIssuer: letsencrypt-azure
#     internal:
#       ingressClassName: nginx-internal

# -- Secret backend configuration
secrets:
  # -- Backend type: k8s, 1password, vault, aws-sm
  backend: k8s
  onePassword:
    # -- Mode: connect or service-account
    mode: connect
    # -- 1Password Connect server URL (connect mode only)
    connectHost: ""
    # -- Name of an existing Secret containing the 1Password token (key: token)
    existingSecret: ""
    # -- Per-environment vault UUID mapping
    vaults: {}
    # Example:
    #   staging: "vault-uuid-staging"
    #   prod: "vault-uuid-prod"

# -- Container registry for private image pulls (optional)
registry:
  enabled: false
  # -- Registry URL
  url: ""
  # -- Registry username (non-secret)
  username: ""
  # -- Name of an existing Secret containing registry credentials
  # Expected key: password (or .dockerconfigjson for pre-built docker config)
  existingSecret: ""
  # -- Which environments need imagePullSecrets from this registry
  environments: []

# -- Template configuration
templates:
  # -- Built-in templates to seed into the gitops repo on initialization
  builtIn:
    - web-service
    - gateway-web-service
    - voiceai-agent
    - valkey
    - color-app
  # -- External template repositories, pinned to a version
  external: []
  # Example:
  # - name: company-templates
  #   repoURL: https://github.com/myorg/suparship-templates.git
  #   ref: v1.2.0
  #   path: templates/
  #   provider: github           # github | gitlab | gitea | bitbucket | generic
  #   existingSecret: company-tpl-credentials

# ---------------------------------------------------------------------------
# Extra objects
# ---------------------------------------------------------------------------
# Include arbitrary Kubernetes resources in this Helm release.
# Use this to deploy SealedSecrets, ExternalSecrets, or plain Secrets
# alongside suparship so credential Secrets exist before the server starts.
#
# Each entry is a complete Kubernetes resource manifest.
extraObjects: []
# Examples:
#
# # --- kubeseal example ---
# - apiVersion: bitnami.com/v1alpha1
#   kind: SealedSecret
#   metadata:
#     name: suparship-gitops-credentials
#     namespace: suparship-system
#   spec:
#     encryptedData:
#       token: AgBy3i...
#
# # --- External Secrets Operator example ---
# - apiVersion: external-secrets.io/v1
#   kind: ExternalSecret
#   metadata:
#     name: suparship-gitops-credentials
#     namespace: suparship-system
#   spec:
#     refreshInterval: 1h
#     secretStoreRef:
#       name: onepassword-store
#       kind: ClusterSecretStore
#     target:
#       name: suparship-gitops-credentials
#     data:
#       - secretKey: token
#         remoteRef:
#           key: suparship-github-pat
#           property: credential
#
# # --- Plain Secret (POC only — do NOT commit to Git) ---
# - apiVersion: v1
#   kind: Secret
#   metadata:
#     name: suparship-admin-auth
#     namespace: suparship-system
#   stringData:
#     password: "$2a$10$..."   # bcrypt hash
