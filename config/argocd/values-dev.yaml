# ArgoCD Helm values — suparship local development profile.
#
# Installs a minimal, single-replica ArgoCD suitable for a kind cluster.
# NOT suitable for staging or production.
#
# Used by: Tiltfile (the `argocd` helm_resource)
# Chart:   argo-cd 7.7.0 (ArgoCD v2.13.x)
# Repo:    https://argoproj.github.io/argo-helm

# ── Disable components not needed in local dev ────────────────────────────

# No SSO provider in local dev.
dex:
  enabled: false

# No alert routing or notifications in local dev.
notifications:
  enabled: false

# ── Single replicas everywhere ────────────────────────────────────────────
# Reduces memory pressure on a single-node kind cluster.

server:
  replicas: 1
  # ── Ingress — routed via NGINX on host port 8880 ───────────────────────
  # Access at http://argocd.localhost:8880  (add to /etc/hosts: 127.0.0.1 argocd.localhost)
  ingress:
    enabled: true
    ingressClassName: nginx
    hostname: argocd.localhost

repoServer:
  replicas: 1

applicationSet:
  replicas: 1

# ── Server: disable TLS termination ──────────────────────────────────────
# The UI and API are served over plain HTTP on port 80 via NGINX ingress.
configs:
  params:
    server.insecure: "true"

  # ── RBAC ─────────────────────────────────────────────────────────────────
  # Explicit policy so the built-in admin account has full access to all
  # ArgoCD resources including applications in user-created AppProjects
  # (e.g. the "demo" project created by suparship).
  #
  # policy.default grants every authenticated session at least read access
  # so the ArgoCD UI loads without "permission denied" errors.
  rbac:
    policy.default: "role:admin"
    policy.csv: |
      p, role:admin, applications, *, */*, allow
      p, role:admin, applicationsets, *, */*, allow
      p, role:admin, clusters,      *, *, allow
      p, role:admin, repositories,  *, *, allow
      p, role:admin, projects,      *, *, allow
      p, role:admin, logs,          get, *, allow
      p, role:admin, exec,          *, */*, allow
      g, admin, role:admin
