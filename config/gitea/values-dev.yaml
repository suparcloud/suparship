# Gitea Helm values — suparship local development profile.
#
# Installs a minimal, single-replica Gitea suitable for a kind cluster.
# NOT suitable for staging or production.
#
# Used by: Tiltfile (the `gitea` helm_resource)
# Chart:   gitea 10.6.0 (Gitea v1.22.x)
# Repo:    https://dl.gitea.com/charts/

# ── Single replicas / minimal resources ──────────────────────────────────
replicaCount: 1

# Recreate, not RollingUpdate: sqlite + the level queue live on the one PVC,
# and a surged replacement pod deadlocks on the old pod's leveldb lock
# ("unable to lock level db at /data/queues/common") — the upgrade never
# completes. Kill the old pod first; a moment of Gitea downtime is fine in dev.
strategy:
  type: Recreate

# ── Disable unused components ────────────────────────────────────────────
redis-cluster:
  enabled: false

postgresql-ha:
  enabled: false

postgresql:
  enabled: false

# ── In-memory / sqlite backend (no external DB needed for local dev) ─────
persistence:
  enabled: true
  size: 1Gi

gitea:
  config:
    database:
      DB_TYPE: sqlite3
    session:
      PROVIDER: memory
    cache:
      ADAPTER: memory
    queue:
      TYPE: level
    indexer:
      ISSUE_INDEXER_TYPE: bleve
      REPO_INDEXER_ENABLED: false
    server:
      # Publicly reachable URL — matches the ingress host + kind port mapping.
      ROOT_URL: "http://gitea.localhost:8880"
      HTTP_PORT: 3000
    actions:
      # Gitea Actions for the CI-driven golden path (shipnotes demo): the
      # host-docker act_runner (Tilt resource `act-runner`) picks up jobs.
      ENABLED: true
      # Resolve unprefixed `uses:` actions (actions/checkout@v4) from GitHub.
      DEFAULT_ACTIONS_URL: "https://github.com"

# ── Bootstrap admin account ──────────────────────────────────────────────
# Dev-only credentials. Clearly fake — do NOT use in production.
  admin:
    username: gitops
    password: gitops-dev-only
    email: gitops@local

# ── Ingress — routed via the NGINX ingress on host port 8880 ─────────────
ingress:
  enabled: true
  className: nginx
  hosts:
    - host: gitea.localhost
      paths:
        - path: /
          pathType: Prefix

service:
  http:
    type: ClusterIP
    port: 3000
