# ArgoCD root "App of Apps" — suparShip dev cluster (Model B — env/cluster-centric).
#
# This Application watches gitops-output/ in the Gitea gitops repo for:
#
#   - appproject.yaml   — ArgoCD AppProject per env/project (applied first via sync-wave)
#   - appset.yaml       — ArgoCD ApplicationSet per environment (each targets one cluster)
#
# Each ApplicationSet discovers all apps for its environment via its Git File
# generator and deploys them to the configured workload cluster. The preview
# ApplicationSet watches gitops-output/previews/ for ephemeral environments.
#
# Applied once during cluster bootstrap by: hack/install-gitea.sh
# To view live status:  kubectl get application suparship-apps -n argocd
#
# NOTE: repoURL below uses the in-cluster Gitea service DNS. Do not change
# this to the host-accessible ingress URL — ArgoCD is inside the cluster.
#
# Template placeholders (replaced by install-gitea.sh at apply time):
#   GITEA_CLUSTER_URL  →  http://gitea-http.gitea.svc.cluster.local:3000
#   GITOPS_REPO_ORG    →  gitops
#   GITOPS_REPO_NAME   →  gitops
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: suparship-apps
  namespace: argocd
  labels:
    suparship.io/managed-by: suparship
    suparship.io/role: root-app
  # Cascade-delete child ApplicationSets when this root app is deleted.
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: default
  source:
    repoURL: "http://gitea-http.gitea.svc.cluster.local:3000/gitops/gitops.git"
    targetRevision: main
    # _infra/ contains ONLY ArgoCD CRD manifests (ApplicationSet, AppProject).
    # Per-app data files (app.yaml, values.yaml) live under env-specific paths
    # where ApplicationSet git generators discover them — not applied here.
    # This avoids brace-expansion glob issues and AppProject duplication.
    path: gitops-output/_infra
    directory:
      recurse: false
  destination:
    # Apply AppProject and ApplicationSet objects into the argocd namespace
    # on the tooling cluster. ApplicationSets then deploy apps to workload
    # clusters according to their destination.server configuration.
    server: https://kubernetes.default.svc
    namespace: argocd
  syncPolicy:
    automated:
      # Remove ApplicationSets whose appset.yaml has been deleted
      # from the repo (e.g. after an environment is decommissioned).
      prune: true
      # Re-sync automatically if live state drifts from Git.
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
