# Seed: default org configuration.
# Applied by: hack/seed.sh  (kubectl apply -f config/seed/)
# Matches the fake/in-memory seed in internal/fake/seed.go so the UI looks
# consistent across both development modes.
apiVersion: v1
kind: ConfigMap
metadata:
  name: suparship-org-config
  namespace: suparship-system
data:
  org.yaml: |
    name: default
    displayName: My Organization
    createdAt: "2026-01-01T00:00:00Z"
    environments:
      - name: staging
        displayName: Staging
        order: 1
        clusterRef: staging-cluster
        baseDomain: localhost
        # {app}-{env} avoids namespace collisions when staging and prod share
        # the same cluster (common in dev/single-cluster setups). In a true
        # multi-cluster setup where each env has its own cluster, {app} alone
        # is sufficient because the cluster boundary provides isolation.
        namespacePattern: "{app}-{env}"
      - name: prod
        displayName: Production
        order: 2
        clusterRef: prod-cluster
        baseDomain: localhost
        namespacePattern: "{app}-{env}"
    teams:
      - name: admins
        displayName: Administrators
        members: [admin]
    roleBindings:
      - project: "*"
        team: admins
        role: org_admin
