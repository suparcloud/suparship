# Seed: demo project (environments are inherited from org config — see org.yaml).
# Applied by: hack/seed.sh  (kubectl apply -f config/seed/)
# Matches the fake/in-memory seed in internal/fake/seed.go.
apiVersion: v1
kind: ConfigMap
metadata:
  name: suparship-project-demo
  namespace: suparship-system
  labels:
    suparship.io/type: project
    suparship.io/project: demo
data:
  project.yaml: |
    apiVersion: suparship.io/v1alpha1
    kind: Project
    metadata:
      name: demo
    spec:
      displayName: Demo Project
      description: Explore suparShip with a pre-seeded project.
      # environments is intentionally empty — this project inherits the canonical
      # pipeline (staging → prod) from the org config. Add entries here only when
      # you need project-specific overrides or additional environments.
      environments: []
      services:
        - name: hello
          template:
            name: web-service
            version: "1.0.0"
          values:
            image_repository: ghcr.io/suparcloud/hello
            image_tag: v1.0.0
      apps:
        - name: hello
          spec:
            displayName: Hello App
            description: A simple hello-world web application.
            template:
              name: web-service
              version: "1.0.0"
            values:
              image_repository: ghcr.io/suparcloud/hello
              image_tag: v1.0.0
            components:
              - name: web
                type: web
                enabledInPreview: true
