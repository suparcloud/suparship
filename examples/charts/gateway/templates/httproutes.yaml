{{- $fullName := include "gateway.fullname" . }}
{{- if .Values.httpsRedirect }}
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: {{ $fullName }}-https-redirect
  labels:
    {{- include "gateway.labels" . | nindent 4 }}
spec:
  parentRefs:
    - name: {{ $fullName }}
      sectionName: http
  rules:
    - filters:
        - type: RequestRedirect
          requestRedirect:
            scheme: https
            statusCode: 301
{{- end }}
{{- range .Values.routes }}
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: {{ $fullName }}-{{ .name }}
  labels:
    {{- include "gateway.labels" $ | nindent 4 }}
spec:
  parentRefs:
    - name: {{ $fullName }}
      {{- with .sectionName }}
      sectionName: {{ . }}
      {{- end }}
  {{- with .hostnames }}
  hostnames:
    {{- range . }}
    - {{ . | quote }}
    {{- end }}
  {{- end }}
  rules:
    {{- toYaml .rules | nindent 4 }}
{{- end }}
