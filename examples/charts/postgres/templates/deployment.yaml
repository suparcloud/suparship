apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "postgres.fullname" . }}
  labels:
    {{- include "postgres.labels" . | nindent 4 }}
spec:
  {{- if .Values.suspend }}
  # Suspended: scaled to zero; the PVC (and data) stays.
  replicas: 0
  {{- else }}
  replicas: 1
  {{- end }}
  # Recreate, never surge: single instance on an RWO volume.
  strategy:
    type: Recreate
  selector:
    matchLabels:
      {{- include "postgres.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      {{- with .Values.podAnnotations }}
      annotations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      labels:
        {{- include "postgres.selectorLabels" . | nindent 8 }}
        {{- with .Values.podLabels }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
    spec:
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      containers:
        - name: postgres
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag | default .Chart.AppVersion }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          ports:
            - name: postgres
              containerPort: 5432
              protocol: TCP
          {{- include "postgres.envFrom" . | trim | nindent 10 }}
          env:
            # Inline env WINS over envFrom in Kubernetes, so auth values are
            # rendered only when set — leave them empty to source
            # POSTGRES_DB/USER/PASSWORD from the envFrom Secret/ConfigMap.
            {{- with .Values.auth.database }}
            - name: POSTGRES_DB
              value: {{ . | quote }}
            {{- end }}
            {{- with .Values.auth.username }}
            - name: POSTGRES_USER
              value: {{ . | quote }}
            {{- end }}
            {{- with .Values.auth.password }}
            - name: POSTGRES_PASSWORD
              value: {{ . | quote }}
            {{- end }}
            # Subdir keeps postgres happy on a fresh PVC (lost+found).
            - name: PGDATA
              value: /var/lib/postgresql/data/pgdata
            {{- range $key, $value := .Values.env }}
            - name: {{ $key | quote }}
              value: {{ $value | quote }}
            {{- end }}
          # sh -c so the container's own env (however it arrived) drives the
          # check — the image defaults the user to 'postgres' when unset.
          readinessProbe:
            exec:
              command: ["sh", "-c", "pg_isready -U \"${POSTGRES_USER:-postgres}\" -d \"${POSTGRES_DB:-postgres}\""]
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            exec:
              command: ["sh", "-c", "pg_isready -U \"${POSTGRES_USER:-postgres}\" -d \"${POSTGRES_DB:-postgres}\""]
            initialDelaySeconds: 30
            periodSeconds: 20
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
          {{- if .Values.persistence.enabled }}
          volumeMounts:
            - name: data
              mountPath: /var/lib/postgresql/data
          {{- end }}
      {{- if .Values.persistence.enabled }}
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: {{ include "postgres.fullname" . }}
      {{- end }}
      {{- with .Values.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
