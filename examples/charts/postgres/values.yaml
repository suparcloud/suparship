# Default values for the postgres chart.
#
# A deliberately small single-instance Postgres for dev/demo composed apps.
# Auth is plain values (visible in git) — fine for demo data; a real install
# points DATABASE_URL at an operator-managed or cloud database instead.

# Written by the platform when the environment is suspended: scales the
# database to zero. The PVC (and the data on it) survives; resume brings the
# instance back against the same volume.
suspend: false

image:
  repository: postgres
  tag: "16-alpine"
  pullPolicy: IfNotPresent

imagePullSecrets: []
nameOverride: ""
fullnameOverride: ""

# Inline auth values — every field is OPTIONAL. Anything left empty is
# expected to arrive as POSTGRES_DB / POSTGRES_USER / POSTGRES_PASSWORD via
# envFrom below instead (e.g. from a platform-managed Secret), which keeps
# credentials out of git.
auth:
  database: app
  username: ""
  password: ""

# envFrom sources by name. When deployed by a platform, point these at the
# managed objects (e.g. ["((platform.secretName))"]).
envFrom:
  configMaps: []
  secrets: []

service:
  port: 5432

persistence:
  enabled: true
  size: 1Gi
  storageClass: ""

resources:
  requests:
    cpu: 50m
    memory: 128Mi
  limits:
    memory: 512Mi

# Extra environment for the container (e.g. POSTGRES_INITDB_ARGS).
env: {}

podAnnotations: {}
podLabels: {}
nodeSelector: {}
tolerations: []
affinity: {}
