# Example GitHub Actions workflow — launch a suparship preview per pull request.
#
# Creates an ephemeral preview environment when a PR is opened/updated and tears
# it down when the PR closes. The preview clones the app's default base env
# (staging) — pass "baseEnv" in the create body to base it on another env.
#
# See docs/previews.md for the full model. Set these repo secrets/vars:
#   secrets.SUPARSHIP_TOKEN  — a project API token with developer (or higher)
#                              role; mint one per docs/api-tokens.md
#   vars.SUPARSHIP_API       — e.g. https://suparship.acme.com/api/v1
#   vars.SUPARSHIP_PROJECT   — the project name (e.g. "voiceai")
#   vars.SUPARSHIP_APP       — the app name (e.g. "livekit-express-caller-v2")
#
# Route (opt-in, label-driven): add the "route-staging" label to serve staging's
# hostname from this PR's preview, so external services that only know the
# staging URL exercise the PR. Staging keeps its image and its delivery pipeline;
# it stays reachable on its "-origin" host. Remove the label to restore; closing
# the PR restores automatically (the preview delete hands the hostname back).
# The route survives PR pushes, so nothing is re-applied per push. Route needs
# the same developer role as the preview. See docs/previews.md#route-send-a-stable-hostname-to-a-preview.
#
# Single-app shown here; for a monorepo, loop the create/delete over each app
# (e.g. read an app list from a matrix) — the API call is per app. If those apps
# form a suparship stack, prefer stack-preview-from-pr.yml: one call previews the
# whole collection and membership changes need no workflow edit.

name: suparship-preview

on:
  pull_request:
    types: [opened, synchronize, reopened, closed, labeled, unlabeled]

# One in-flight run per PR; a newer push supersedes an older create/route.
concurrency:
  group: suparship-preview-${{ github.event.pull_request.number }}
  cancel-in-progress: false

jobs:
  preview:
    # Label events are handled by the route job below.
    if: github.event.action != 'labeled' && github.event.action != 'unlabeled'
    runs-on: ubuntu-latest
    env:
      API: ${{ vars.SUPARSHIP_API }}
      PROJECT: ${{ vars.SUPARSHIP_PROJECT }}
      APP: ${{ vars.SUPARSHIP_APP }}
      TOKEN: ${{ secrets.SUPARSHIP_TOKEN }}
      NAME: pr-${{ github.event.pull_request.number }}
      # Tag the image with the PR head commit so each push is a distinct,
      # immutable tag the preview redeploys to. Build & push this tag in a step
      # before the create call (omitted here — it's specific to your registry).
      IMAGE_TAG: ${{ github.event.pull_request.head.sha }}
    steps:
      # - name: Build & push image    # your registry/Dockerfile
      #   run: docker build -t $REGISTRY/$APP:$IMAGE_TAG . && docker push $REGISTRY/$APP:$IMAGE_TAG

      - name: Create or update preview
        if: github.event.action != 'closed'
        run: |
          # Upsert: 201 = created, 200 = re-published with the new image tag.
          # Passing imageTag re-points the preview at this PR's freshly-built image
          # (omit it to inherit the base env's image).
          code=$(curl -sS -o /tmp/resp -w '%{http_code}' \
            -X POST "$API/projects/$PROJECT/apps/$APP/previews" \
            -H "Authorization: Bearer $TOKEN" \
            -H 'Content-Type: application/json' \
            -d "{\"name\":\"$NAME\",\"imageTag\":\"$IMAGE_TAG\"}")
          echo "HTTP $code"; cat /tmp/resp
          if [ "$code" != "201" ] && [ "$code" != "200" ]; then exit 1; fi

      - name: Delete preview
        if: github.event.action == 'closed'
        run: |
          # 200/204 = deleted, 404 = already gone — both OK.
          code=$(curl -sS -o /tmp/resp -w '%{http_code}' \
            -X DELETE "$API/projects/$PROJECT/apps/$APP/previews/$NAME" \
            -H "Authorization: Bearer $TOKEN")
          echo "HTTP $code"; cat /tmp/resp
          case "$code" in 200|204|404) ;; *) exit 1 ;; esac

  # Route lifecycle — label-driven. Also (re)applies a label that was already on
  # the PR when the preview was (re)created, since routing needs the preview to
  # exist (404 otherwise). needs:[preview] + always() lets the label paths run
  # when preview is skipped.
  route:
    needs: [preview]
    if: >
      always() &&
      (
        (github.event.action == 'labeled'   && github.event.label.name == 'route-staging') ||
        (github.event.action == 'unlabeled' && github.event.label.name == 'route-staging') ||
        ((github.event.action == 'opened' || github.event.action == 'reopened') &&
          needs.preview.result == 'success' &&
          contains(github.event.pull_request.labels.*.name, 'route-staging'))
      )
    runs-on: ubuntu-latest
    env:
      API: ${{ vars.SUPARSHIP_API }}
      PROJECT: ${{ vars.SUPARSHIP_PROJECT }}
      APP: ${{ vars.SUPARSHIP_APP }}
      TOKEN: ${{ secrets.SUPARSHIP_TOKEN }}
      NAME: pr-${{ github.event.pull_request.number }}
      ACTION: ${{ github.event.action }}
    steps:
      - name: Route or restore staging hostname
        run: |
          set -euo pipefail
          url="$API/projects/$PROJECT/apps/$APP/environments/staging/route"
          # Route accepts by default (202 + task): it waits on ArgoCD between
          # its two publishes, longer than a gateway timeout. Poll the task
          # until it is terminal; the task's "phase"/"message" say what it is
          # doing. Pass ?async=0 to get the inline result instead.
          wait_task() {
            status_url="$1"
            for _ in $(seq 1 150); do
              sleep 2
              curl -sS -o /tmp/task "$API${status_url#/api/v1}" -H "Authorization: Bearer $TOKEN"
              state=$(jq -r .state /tmp/task)
              echo "task $state $(jq -r '[.phase, .message] | map(select(. != null)) | join(": ")' /tmp/task)"
              case "$state" in
                succeeded) jq . /tmp/task; return 0 ;;
                failed)    jq . /tmp/task; return 1 ;;
              esac
            done
            echo "timed out waiting for the task (it keeps running server-side)"; return 1
          }
          if [ "$ACTION" = "unlabeled" ]; then
            # Restore: staging serves its own hostname again; the preview goes
            # back to its preview URL. 200 even when nothing was routed.
            code=$(curl -sS -o /tmp/resp -w '%{http_code}' -X DELETE "$url" \
              -H "Authorization: Bearer $TOKEN")
          else
            # Route: the preview takes staging's hostname. Routing over another
            # PR's route replaces it (that PR's preview returns to its own URL).
            # To refuse a takeover, GET .../apps/$APP and check
            # .environments[] | select(.envName=="staging") | .routedToPreview first.
            code=$(curl -sS -o /tmp/resp -w '%{http_code}' -X POST "$url" \
              -H "Authorization: Bearer $TOKEN" -H 'Content-Type: application/json' \
              -d "{\"fromPreview\":\"$NAME\"}")
          fi
          echo "HTTP $code"; cat /tmp/resp; echo
          case "$code" in
            202) wait_task "$(jq -r .statusUrl /tmp/resp)" ;;
            200) ;;
            *)   echo "route $ACTION failed"; exit 1 ;;
          esac
