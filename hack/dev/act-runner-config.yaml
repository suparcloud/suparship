# hack/dev/act-runner-config.yaml — Gitea Actions runner config for the dev
# loop (started by hack/dev/act-runner.sh, the Tiltfile `act-runner` resource).
#
# The runner runs as a container on the HOST docker daemon with the daemon's
# socket mounted, and `container.docker_host: ""` (auto-detect) makes it mount
# that same socket into job containers — so a workflow's `docker build/push`
# talks to the host daemon directly. `docker push localhost:5001/...` then
# takes the exact path `task demo:color-app:release` uses (the daemon resolves
# localhost:5001 to the ctlptl kind registry; localhost registries are
# insecure-allowed, no daemon config needed).
log:
  level: info

runner:
  # Poll frequently: this is a dev loop, latency beats politeness.
  fetch_interval: 2s
  labels:
    # catthehacker/ubuntu:act-latest ships node + docker CLI — enough for
    # actions/checkout and plain docker build/push, no extra setup actions.
    - "ubuntu-latest:docker://catthehacker/ubuntu:act-latest"

container:
  # "" = auto-detect the docker host AND mount it into job containers
  # ("-" would skip the mount and break in-job docker builds).
  docker_host: ""
  privileged: false
  # Job containers reach Gitea + the suparship API at host.docker.internal.
  # Docker Desktop / OrbStack resolve it natively; native Linux docker does
  # NOT — map it to the docker host-gateway explicitly (harmless on macOS).
  options: "--add-host=host.docker.internal:host-gateway"
