{{- $web := .Values.components.web }}
{{- if $web.enabled }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "color-app.fullname" . }}
  labels:
    {{- include "color-app.labels" . | nindent 4 }}
  annotations:
    {{- include "suparship-common.reloaderAnnotation" . | nindent 4 }}
spec:
  replicas: {{ $web.replicas | default 1 }}
  selector:
    matchLabels:
      {{- include "color-app.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "color-app.selectorLabels" . | nindent 8 }}
        {{- include "suparship-common.componentNameLabel" "web" | nindent 8 }}
    spec:
      {{- if .Values.serviceAccount.create }}
      serviceAccountName: {{ include "color-app.serviceAccountName" . }}
      {{- end }}
      containers:
        - name: {{ include "color-app.fullname" . }}
          image: "{{ $web.image.repository }}:{{ $web.image.tag | default "0.1.0" }}"
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: {{ $web.port | default 8080 }}
              protocol: TCP
          {{- include "suparship-common.envFrom" . | nindent 10 }}
          # ComponentSpec.Config and app-specific vars: direct env entries — override all envFrom.
          env:
            - name: COLOR
              value: {{ ($web.env).COLOR | default "blue" | quote }}
            - name: PORT
              value: {{ $web.port | default 8080 | quote }}
          livenessProbe:
            httpGet:
              path: {{ (($web.healthCheck).path) | default "/healthz" }}
              port: http
            initialDelaySeconds: 3
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: {{ (($web.healthCheck).path) | default "/healthz" }}
              port: http
            initialDelaySeconds: 2
            periodSeconds: 5
          resources:
            {{- include "color-app.resources" . | nindent 12 }}
{{- end }}
