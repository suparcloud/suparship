{{- $web := .Values.components.web }}
{{- if $web.enabled }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "color-app.fullname" . }}
  labels:
    {{- include "color-app.labels" . | nindent 4 }}
  annotations:
    # Stakater Reloader: trigger rolling restart when any referenced
    # ConfigMap or Secret changes (covers ESO secret rotation).
    reloader.stakater.com/auto: "true"
spec:
  replicas: {{ $web.replicas | default 1 }}
  selector:
    matchLabels:
      {{- include "color-app.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "color-app.selectorLabels" . | nindent 8 }}
    spec:
      {{- if .Values.serviceAccount.create }}
      serviceAccountName: {{ include "color-app.serviceAccountName" . }}
      {{- end }}
      containers:
        - name: {{ include "color-app.fullname" . }}
          image: "{{ $web.image.repository }}:{{ $web.image.tag | default "0.1.0" }}"
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: {{ $web.port | default 8080 }}
              protocol: TCP
          # envFrom loads hierarchy levels in order; last entry wins for duplicates.
          # Levels 1-3 (org, env, project) are replicated here from suparship-system
          # by Stakater Replicator. Levels 4-5 (app, appenv) are created by this chart.
          envFrom:
            # Level 1 — Org
            - configMapRef:
                name: suparship-envvars-org
                optional: true
            - secretRef:
                name: suparship-secrets-org-k8s
                optional: true
            # Level 2 — Environment (org-level per env type)
            - configMapRef:
                name: suparship-envvars-env-{{ .Values.app.env }}
                optional: true
            - secretRef:
                name: suparship-secrets-env-{{ .Values.app.env }}-k8s
                optional: true
            # Level 3 — Project
            - configMapRef:
                name: suparship-envvars-project
                optional: true
            - secretRef:
                name: suparship-secrets-project-k8s
                optional: true
            # Level 4 — App
            - configMapRef:
                name: suparship-envvars-app
                optional: true
            - secretRef:
                name: suparship-secrets-app-k8s
                optional: true
            # Level 5 — App Environment (most specific, wins all)
            - configMapRef:
                name: suparship-envvars-appenv
                optional: true
            - secretRef:
                name: suparship-secrets-appenv-k8s
                optional: true
          # ComponentSpec.Config and app-specific vars: direct env entries — override all envFrom.
          env:
            - name: COLOR
              value: {{ ($web.env).COLOR | default "blue" | quote }}
            - name: PORT
              value: {{ $web.port | default 8080 | quote }}
          livenessProbe:
            httpGet:
              path: {{ (($web.healthCheck).path) | default "/healthz" }}
              port: http
            initialDelaySeconds: 3
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: {{ (($web.healthCheck).path) | default "/healthz" }}
              port: http
            initialDelaySeconds: 2
            periodSeconds: 5
          resources:
            {{- include "color-app.resources" . | nindent 12 }}
{{- end }}
