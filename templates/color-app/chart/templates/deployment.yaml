{{- $web := .Values.components.web }}
{{- if $web.enabled }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "color-app.fullname" . }}
  labels:
    {{- include "color-app.labels" . | nindent 4 }}
  annotations:
    # Stakater Reloader: trigger rolling restart when any referenced
    # ConfigMap or Secret changes (covers ESO secret rotation).
    reloader.stakater.com/auto: "true"
spec:
  replicas: {{ $web.replicas | default 1 }}
  selector:
    matchLabels:
      {{- include "color-app.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "color-app.selectorLabels" . | nindent 8 }}
    spec:
      {{- if .Values.serviceAccount.create }}
      serviceAccountName: {{ include "color-app.serviceAccountName" . }}
      {{- end }}
      containers:
        - name: {{ include "color-app.fullname" . }}
          image: "{{ $web.image.repository }}:{{ $web.image.tag | default "0.1.0" }}"
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: {{ $web.port | default 8080 }}
              protocol: TCP
          # envFrom loads the full hierarchy of ConfigMaps + Secrets that
          # suparship's publisher computed for this app-env. Order is
          # precedence-aware (org → env-type → project → app → app-env →
          # cluster); later entries win on key collision per Kubernetes
          # envFrom semantics. The chart does no name construction —
          # naming patterns and backend choice live in the publisher.
          # All entries are optional so pods start even when a level has
          # no config yet.
          envFrom:
            {{- range .Values.suparship.envFromConfigMaps }}
            - configMapRef:
                name: {{ . }}
                optional: true
            {{- end }}
            {{- range .Values.suparship.envFromSecrets }}
            - secretRef:
                name: {{ . }}
                optional: true
            {{- end }}
          # ComponentSpec.Config and app-specific vars: direct env entries — override all envFrom.
          env:
            - name: COLOR
              value: {{ ($web.env).COLOR | default "blue" | quote }}
            - name: PORT
              value: {{ $web.port | default 8080 | quote }}
          livenessProbe:
            httpGet:
              path: {{ (($web.healthCheck).path) | default "/healthz" }}
              port: http
            initialDelaySeconds: 3
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: {{ (($web.healthCheck).path) | default "/healthz" }}
              port: http
            initialDelaySeconds: 2
            periodSeconds: 5
          resources:
            {{- include "color-app.resources" . | nindent 12 }}
{{- end }}
