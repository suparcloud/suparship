{{/*
  env-externalsecrets.yaml — creates ExternalSecret CRs for App and AppEnv
  levels, grouped by (level, provider).
  Upper levels are handled by gitops-output/_infra/.
*/}}
{{- $providers := list "k8s" "vault" "aws-sm" }}
{{- $storeNames := dict "k8s" "suparship-k8s-store" "vault" "suparship-vault-store" "aws-sm" "suparship-aws-sm-store" }}
{{- $levels := dict "app" ((.Values.envLayers).app) "appEnv" ((.Values.envLayers).appEnv) }}

{{- range $level, $layer := $levels }}
{{- if $layer }}
{{- range $provider := $providers }}
{{- $refs := list }}
{{- range ($layer.secretRefs | default list) }}
{{- if eq .provider $provider }}
{{- $refs = append $refs . }}
{{- end }}
{{- end }}
{{- if $refs }}
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: suparship-secrets-{{ $level | lower }}-{{ $provider }}
  labels:
    {{- include "color-app.labels" $ | nindent 4 }}
    suparship.io/type: external-secret
    suparship.io/level: {{ $level | lower }}
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: {{ index $storeNames $provider }}
    kind: ClusterSecretStore
  target:
    name: suparship-secrets-{{ $level | lower }}-{{ $provider }}
    creationPolicy: Owner
  data:
  {{- range $refs }}
  - secretKey: {{ .envKey }}
    remoteRef:
      key: {{ .name }}
      property: {{ .key }}
  {{- end }}
---
{{- end }}
{{- end }}
{{- end }}
{{- end }}
