# suparShip Template: color-app
#
# A demo template for the color-app: a tiny HTTP service that returns its
# configured color as both an HTML page and a JSON API. Designed for
# demonstrating Kargo promotion pipelines (image tag → Freight → staging → prod).
#
# Engine: Helm
# Chart:  ./chart

apiVersion: suparship.io/v1alpha1
kind: Template
metadata:
  name: color-app
  version: "1.0.0"
spec:
  title: Color App (Demo)
  description: >-
    A demo app that displays a color. Useful for visually demonstrating
    promotions, preview environments, and canary releases — push a new
    image tag with a different color and watch it propagate through stages.
  category: demo
  engine:
    type: helm
    chart: ./chart

  components:
    - name: web
      type: web
      required: true
      defaultEnabled: true
      previewEnabled: true
      exposed: true
      produces: [Deployment, Service]
      optionallyProduces: [Ingress]
      capabilities:
        # color-app is a demo: keep the form lean — no autoscaling
        # input, no PDB, no replicas slider. Resources stays on so the
        # operator can pick small/medium/large.
        autoscaling: none
        pdb: false
        replicas: false

  inputs:
    - name: service_name
      title: App Name
      type: string
      required: true
      description: >-
        Name for this app. Used in Kubernetes resource names.
      pattern: "^[a-z][a-z0-9-]{0,61}[a-z0-9]$"

    - name: image_repository
      title: Image Repository
      type: string
      required: true
      default: "kind-registry:5000/demo/color-app"
      description: >-
        Container image repository for the color-app.

    - name: image_tag
      title: Image Tag
      type: string
      default: "0.1.0"
      description: >-
        Image tag (semver). Kargo watches for new tags.

    - name: color
      title: Color
      type: enum
      options:
        - blue
        - green
        - red
        - purple
        - orange
      default: blue
      description: >-
        Background color displayed by the app. Useful for visually
        identifying which version is deployed in each environment.

    - name: port
      title: Container Port
      type: number
      default: 8080
      description: >-
        TCP port the container listens on. Override when your image
        listens on a non-default port (e.g. nginx → 80).

    - name: health_path
      title: Health Check Path
      type: string
      default: /healthz
      description: >-
        HTTP path for liveness and readiness probes. Override when your
        image doesn't expose /healthz (e.g. nginx → /).

  advancedInputs:
    - name: replicas
      title: Replica Count
      type: number
      default: 1
      min: 1
      max: 10

  mappings:
    fullnameOverride: "{{ .inputs.service_name }}"
    image.repository: "{{ .inputs.image_repository }}"
    image.tag: "{{ .inputs.image_tag }}"
    replicaCount: "{{ .inputs.replicas }}"
    port: "{{ .inputs.port }}"
    color: "{{ .inputs.color }}"
