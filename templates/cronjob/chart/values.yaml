# Default values for the cronjob template chart.
#
# Follows the suparship canonical HelmValues schema (see
# templates/web-service/chart/values.yaml for the full commentary). A cron
# task has no Service, Ingress, routing, replicas or autoscaling.

# -- App identity — injected by suparship at publish time.
app:
  name: ""
  env: ""

# -- Platform metadata — injected by suparship at publish time.
platform:
  org: ""
  project: ""
  app: ""
  env: ""
  envType: ""
  cluster: ""
  namespace: ""
  baseDomain: ""
  routingHost: ""

# -- Per-component configuration managed by suparship.
components:
  cron:
    enabled: true
    image:
      # Default to a harmless placeholder; set your own image.
      repository: busybox
      tag: "stable"
    # The task entrypoint, when the image's own entrypoint isn't it.
    command: []
    args: []
    # `replicas` is required by the canonical schema; meaningless for a
    # CronJob and unused by this chart.
    replicas: 1
    # Cron expression, in the cluster's timezone (usually UTC).
    schedule: "0 3 * * *"
    # Forbid (default) | Allow | Replace — whether a new run may start while
    # the previous one is still going.
    concurrencyPolicy: Forbid
    # Skip (don't fire late) runs missed by more than this many seconds.
    startingDeadlineSeconds: 300
    # Per-run retry budget before the run counts as failed.
    backoffLimit: 2
    # Optional wall-clock cap per run, seconds. Unset = no cap.
    activeDeadlineSeconds: null
    successfulJobsHistoryLimit: 3
    failedJobsHistoryLimit: 3
    # Component-level pause. The platform-level `suspend` (set by app
    # suspend/resume) also pauses the schedule.
    suspend: false
    resources:
      # small | medium | large — maps to CPU/memory limits via the
      # suparship-common library helper.
      size: small

# -- Platform suspend flag (written by app suspend/resume) — pauses the
# schedule without deleting the CronJob.
suspend: false

# -- Routing is not used by a cron task, but the canonical schema requires the block.
routing:
  host: ""
  component: cron

# -- ServiceAccount configuration.
serviceAccount:
  create: true
  name: ""
  annotations: {}

# -- Stakater Reloader — not meaningful for CronJobs (each run picks up the
# latest ConfigMap/Secret when it starts); kept for schema parity.
reloader: ""

# -- envFrom hierarchy — populated by the suparship publisher per app-env.
suparship:
  envFromConfigMaps: []
  envFromSecrets: []
