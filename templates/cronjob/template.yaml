# suparship Template: cronjob
#
# A scheduled task that runs on a cron expression — report generation, data
# sync, cleanup, digest emails. Unlike the `job` template (a one-shot ArgoCD
# PreSync hook that gates a release), a cronjob is a LONG-LIVED CronJob
# resource that Kubernetes runs on schedule, independent of deploys.
#
# The platform suspend convention maps straight onto CronJob.spec.suspend:
# suspending the app pauses the schedule without deleting anything, and
# resuming picks the schedule back up.
#
# Engine: Helm
# Chart:  ./chart

apiVersion: suparship.io/v1alpha1
kind: Template
metadata:
  name: cronjob
  version: "1.0.0"
spec:
  title: Scheduled Job
  description: >-
    Run a task on a cron schedule — reports, syncs, cleanups. Concurrent runs
    are forbidden by default (a slow run never overlaps the next), failed runs
    are kept for debugging, and suspending the app pauses the schedule.
  category: cron
  engine:
    type: helm
    chart: ./chart

  components:
    - name: cron
      type: cron
      required: true
      defaultEnabled: true
      exposed: false
      produces: [CronJob]
      capabilities: {}

  developerValues:
    - path: components.cron.image.repository
      title: Image Repository
      type: string
      required: true
      description: Container image repository to run the task from.
    - path: components.cron.schedule
      title: Schedule
      type: string
      default: "0 3 * * *"
      description: >-
        Cron expression (UTC), e.g. "0 3 * * *" for daily at 03:00 or
        "*/15 * * * *" for every 15 minutes.
    - path: components.cron.resources.size
      title: Resource Size
      type: enum
      options: [small, medium, large]
      description: |-
        CPU/memory profile.
        small 250m/256Mi · medium 500m/512Mi · large 1/1Gi
