{{- $job := .Values.components.job }}
{{- if $job.enabled }}
apiVersion: batch/v1
kind: Job
metadata:
  name: {{ include "job.fullname" . }}
  labels:
    {{- include "job.labels" . | nindent 4 }}
  annotations:
    # Run as an ArgoCD PreSync hook so this Job completes BEFORE the app's
    # long-running components sync — gating the release on its success (e.g. a DB
    # migration must succeed before the new code rolls out). BeforeHookCreation
    # deletes the previous run's Job first, so each sync re-runs it cleanly
    # (Jobs are otherwise immutable).
    argocd.argoproj.io/hook: PreSync
    argocd.argoproj.io/hook-delete-policy: BeforeHookCreation
spec:
  backoffLimit: 0
  template:
    metadata:
      labels:
        {{- include "job.selectorLabels" . | nindent 8 }}
        {{- include "suparship-common.componentNameLabel" "job" | nindent 8 }}
    spec:
      restartPolicy: Never
      containers:
        - name: {{ include "job.fullname" . }}
          image: "{{ $job.image.repository | default "busybox" }}:{{ $job.image.tag | default "latest" }}"
          imagePullPolicy: IfNotPresent
          {{- with $job.command }}
          command:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          {{- with $job.args }}
          args:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          resources:
            {{- include "job.resources" . | nindent 12 }}
          {{- include "suparship-common.envFrom" . | nindent 10 }}
          {{- if $job.env }}
          # ComponentSpec.Config: direct env entries override the envFrom levels.
          env:
            {{- range $k, $v := $job.env }}
            - name: {{ $k }}
              value: {{ $v | quote }}
            {{- end }}
          {{- end }}
{{- end }}
