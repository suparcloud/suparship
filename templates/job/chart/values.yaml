# Default values for the job template chart.
#
# Follows the suparship canonical HelmValues schema generated by
# internal/helmvalues/mapper.go. All keys under `components.job.*` are set by
# suparship at publish time from the app spec; only defaults need declaring here.
#
# A one-shot Job: no ingress, no autoscaling. `replicas` is required by the
# canonical schema but ignored by a Job (a Job runs to completion once).

# -- App identity — injected by suparship at publish time.
app:
  name: ""
  env: ""

# -- Platform metadata — injected by suparship at publish time.
platform:
  org: ""
  project: ""
  app: ""
  env: ""
  envType: ""
  cluster: ""
  namespace: ""
  baseDomain: ""
  routingHost: ""
  ingressClassName: ""
  clusterIssuer: ""

# -- Per-component configuration managed by suparship.
components:
  job:
    enabled: true
    image:
      # Placeholder — set the app image (typically the same monorepo image the
      # api/worker run) via the component's image.
      repository: busybox
      tag: "latest"
    # Required by the canonical schema; ignored by a Job.
    replicas: 1
    # command/args are the task to run, e.g.:
    #   command: ["alembic", "upgrade", "head"]
    # Set per-app on the component; the chart runs the image's default
    # entrypoint when unset.
    resources:
      # small | medium | large — maps to CPU/memory limits via the
      # suparship-common library helper.
      size: small

# -- Routing is not used by a Job, but the canonical schema requires the block.
routing:
  host: ""
  component: job

# A migration Job runs under the namespace default ServiceAccount — it needs no
# RBAC of its own, and a PreSync hook would run before a normally-synced SA
# exists — so this chart intentionally creates no ServiceAccount.

# -- envFrom hierarchy — populated by the suparship publisher per app-env, so the
# migration sees the same config/secrets the app's workloads do.
suparship:
  envFromConfigMaps: []
  envFromSecrets: []
