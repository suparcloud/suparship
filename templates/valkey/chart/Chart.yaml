apiVersion: v2
name: valkey
description: suparShip wrapper around the Valkey upstream chart, producing a Secret matching the redis connection contract
type: application
version: 0.1.0
appVersion: "0.1.0"
annotations:
  suparship.io/values-schema-version: v1
  # Wrapper charts use the AddonInstanceValues shape, not the
  # canonical HelmValues shape. The schema generator skips charts
  # carrying this annotation; the schema is hand-maintained instead.
  suparship.io/chart-kind: addon
dependencies:
  - name: suparship-common
    version: "0.1.0"
    repository: "file://../../../charts/lib/suparship-common"
