{{- if .Values.addon.enabled -}}
apiVersion: v1
kind: Secret
type: Opaque
metadata:
  name: {{ include "valkey.connectionSecretName" . }}
  labels:
    {{- include "valkey.labels" . | nindent 4 }}
    {{- include "suparship-common.componentNameLabel" "valkey" | nindent 4 }}
    suparship.io/addon-type: redis
stringData:
  # Contract keys for the suparship `redis` connection contract.
  # Consumer apps' components pick this Secret up via envFrom
  # (publisher writes the Secret name into
  # suparship.envFromSecrets[]).
  REDIS_URL: {{ include "valkey.connectionURL" . | quote }}
  REDIS_HOST: {{ include "valkey.serviceHost" . | quote }}
  REDIS_PORT: "6379"
  # Auth disabled for the prototype. When the Bitnami valkey subchart
  # is wired (step 3.5) this will source from the auth Secret the
  # subchart materialises.
  REDIS_PASSWORD: ""
{{- end }}
