# Default values for the valkey addon wrapper chart.
#
# Follows the suparShip canonical AddonInstanceValues schema. The
# publisher writes app.{name,env}, addon.{type,size,version,
# secretName}, and suparship.envFrom* at publish time.
#
# The Bitnami valkey upstream chart is wired as a subchart at
# `valkey:`; this wrapper translates the small suparship-side surface
# (addon.size, addon.persistence) into the upstream's many knobs.

# -- App identity (publisher-injected at deploy time).
app:
  name: ""
  env: ""

# -- Addon claim resolved configuration. The wrapper renders the
# upstream chart and the connection-contract Secret from these values.
addon:
  enabled: true
  type: redis           # contract identifier; do not change
  provider: ""          # provider label (e.g. "valkey-operator")
  size: small           # mapped to upstream master.resources below
  version: ""
  # SecretName is the connection-Secret name the consumer app's
  # components envFrom. Empty falls back to "{Release.Name}-conn"
  # for direct local installs.
  secretName: ""
  # Persistence: when true, the upstream chart provisions a PVC for
  # the primary node so data survives pod restarts. Off by default
  # for dev / preview environments.
  persistence: false

# -- Stakater Reloader auto-restart on referenced ConfigMap/Secret
# change. Off by default for addons (the wrapper itself isn't
# typically configured by external secrets).
reloader: ""

# -- envFrom hierarchy (publisher-injected). Wrapper containers can
# opt into it via suparship-common.envFrom; the upstream subchart
# does not.
suparship:
  envFromConfigMaps: []
  envFromSecrets: []

# -- ServiceAccount for the wrapper's own resources. The upstream
# subchart manages its own SA.
serviceAccount:
  create: false
  name: ""
  annotations: {}

# ---------------------------------------------------------------------------
# Upstream Bitnami valkey subchart values.
#
# Defaults below assume:
#   * Standalone (single-primary) topology — simplest for dev/preview.
#     Switch to architecture=replication via addon.values when an
#     operator wants HA.
#   * Auth disabled — REDIS_PASSWORD is "" in the contract Secret.
#     Tighten for production by enabling auth + sourcing the password
#     into the contract Secret in a follow-up step.
#   * NetworkPolicy disabled — the default Bitnami policy assumes
#     CNI policies are enforced; many dev clusters don't run them.
# ---------------------------------------------------------------------------
valkey:
  architecture: standalone
  auth:
    enabled: false
  networkPolicy:
    enabled: false
  # Persistence is overridden at template-render time from
  # addon.persistence (see _helpers.tpl). The upstream default is
  # `enabled: true` with an 8Gi PVC; we flip the default to off to
  # match the suparship-side `addon.persistence: false`.
  primary:
    persistence:
      enabled: false
    # Resources for the primary node. Mapped from addon.size by
    # the wrapper at chart-template time (see _helpers.tpl); set
    # explicitly via addon.values when a finer hand is needed.
    resources:
      requests:
        cpu: "100m"
        memory: "128Mi"
      limits:
        cpu: "500m"
        memory: "512Mi"
  # Compatibility settings — set FIPS to "off" for dev environments
  # where the FIPS image variants aren't pulled. Operators on FIPS-
  # mandated platforms override via addon.values per-app.
  global:
    defaultFips: "off"
