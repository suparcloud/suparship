{{- $web := .Values.components.web }}
{{- if $web.enabled }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "web-service.fullname" . }}
  labels:
    {{- include "web-service.labels" . | nindent 4 }}
  annotations:
    # Stakater Reloader: trigger rolling restart when any referenced
    # ConfigMap or Secret changes (covers ESO secret rotation).
    reloader.stakater.com/auto: "true"
spec:
  {{- if not .Values.autoscaling.enabled }}
  replicas: {{ $web.replicas | default 2 }}
  {{- end }}
  selector:
    matchLabels:
      {{- include "web-service.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "web-service.selectorLabels" . | nindent 8 }}
    spec:
      {{- if .Values.serviceAccount.create }}
      serviceAccountName: {{ include "web-service.serviceAccountName" . }}
      {{- end }}
      containers:
        - name: {{ include "web-service.fullname" . }}
          image: "{{ $web.image.repository | default "nginx" }}:{{ $web.image.tag | default "stable" }}"
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: {{ $web.port | default 80 }}
              protocol: TCP
          livenessProbe:
            httpGet:
              path: {{ (($web.healthCheck).path) | default "/" }}
              port: http
            initialDelaySeconds: 10
            periodSeconds: 15
            timeoutSeconds: 3
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: {{ (($web.healthCheck).path) | default "/" }}
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 3
          resources:
            {{- include "web-service.resources" . | nindent 12 }}
          # envFrom loads the full hierarchy of ConfigMaps + Secrets that
          # suparship's publisher computed for this app-env. Order is
          # precedence-aware (org → env-type → project → app → app-env →
          # cluster); later entries win on key collision per Kubernetes
          # envFrom semantics. The chart does no name construction —
          # naming patterns and backend choice live in the publisher.
          # All entries are optional so pods start even when a level has
          # no config yet.
          envFrom:
            {{- range .Values.suparship.envFromConfigMaps }}
            - configMapRef:
                name: {{ . }}
                optional: true
            {{- end }}
            {{- range .Values.suparship.envFromSecrets }}
            - secretRef:
                name: {{ . }}
                optional: true
            {{- end }}
          {{- if $web.env }}
          # ComponentSpec.Config: direct env entries — override all envFrom levels above.
          env:
            {{- range $k, $v := $web.env }}
            - name: {{ $k }}
              value: {{ $v | quote }}
            {{- end }}
          {{- end }}
{{- end }}
