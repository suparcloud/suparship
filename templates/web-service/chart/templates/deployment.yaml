{{- $web := .Values.components.web }}
{{- if $web.enabled }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "web-service.fullname" . }}
  labels:
    {{- include "web-service.labels" . | nindent 4 }}
  annotations:
    {{- include "suparship-common.reloaderAnnotation" . | nindent 4 }}
spec:
  {{- if not .Values.autoscaling.enabled }}
  replicas: {{ $web.replicas | default 2 }}
  {{- end }}
  # Zero-downtime rollout: surge one pod up before taking one down
  # (chart-conventions #9).
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  selector:
    matchLabels:
      {{- include "web-service.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "web-service.selectorLabels" . | nindent 8 }}
        {{- include "suparship-common.componentNameLabel" "web" | nindent 8 }}
    spec:
      {{- if .Values.serviceAccount.create }}
      serviceAccountName: {{ include "web-service.serviceAccountName" . }}
      {{- end }}
      terminationGracePeriodSeconds: {{ .Values.terminationGracePeriodSeconds | default 30 }}
      containers:
        - name: {{ include "web-service.fullname" . }}
          image: "{{ $web.image.repository | default "nginx" }}:{{ $web.image.tag | default "stable" }}"
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: {{ $web.port | default 80 }}
              protocol: TCP
          livenessProbe:
            httpGet:
              path: {{ (($web.healthCheck).path) | default "/" }}
              port: http
            initialDelaySeconds: 10
            periodSeconds: 15
            timeoutSeconds: 3
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: {{ (($web.healthCheck).path) | default "/" }}
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 3
          resources:
            {{- include "web-service.resources" . | nindent 12 }}
          {{- if gt (int (.Values.preStopSleepSeconds | default 15)) 0 }}
          # Keep serving while endpoints controllers and load balancers drop
          # this pod from rotation — SIGTERM alone races them and returns 502s
          # during rollouts (chart-conventions #10).
          lifecycle:
            preStop:
              exec:
                command: ["sh", "-c", "sleep {{ .Values.preStopSleepSeconds | default 15 }}"]
          {{- end }}
          {{- include "suparship-common.envFrom" . | nindent 10 }}
          {{- if $web.env }}
          # ComponentSpec.Config: direct env entries — override all envFrom levels above.
          env:
            {{- range $k, $v := $web.env }}
            - name: {{ $k }}
              value: {{ $v | quote }}
            {{- end }}
          {{- end }}
{{- end }}
