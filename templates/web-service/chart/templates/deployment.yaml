{{- $web := .Values.components.web }}
{{- if $web.enabled }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "web-service.fullname" . }}
  labels:
    {{- include "web-service.labels" . | nindent 4 }}
  annotations:
    # Stakater Reloader: trigger rolling restart when any referenced
    # ConfigMap or Secret changes (covers ESO secret rotation).
    reloader.stakater.com/auto: "true"
spec:
  {{- if not .Values.autoscaling.enabled }}
  replicas: {{ $web.replicas | default 2 }}
  {{- end }}
  selector:
    matchLabels:
      {{- include "web-service.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "web-service.selectorLabels" . | nindent 8 }}
    spec:
      {{- if .Values.serviceAccount.create }}
      serviceAccountName: {{ include "web-service.serviceAccountName" . }}
      {{- end }}
      containers:
        - name: {{ include "web-service.fullname" . }}
          image: "{{ $web.image.repository | default "nginx" }}:{{ $web.image.tag | default "stable" }}"
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: {{ $web.port | default 80 }}
              protocol: TCP
          livenessProbe:
            httpGet:
              path: {{ (($web.healthCheck).path) | default "/" }}
              port: http
            initialDelaySeconds: 10
            periodSeconds: 15
            timeoutSeconds: 3
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: {{ (($web.healthCheck).path) | default "/" }}
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 3
          resources:
            {{- include "web-service.resources" . | nindent 12 }}
          # envFrom loads hierarchy levels in order; last entry wins for duplicates.
          # Levels 1-3 (org, env, project) are replicated here from suparship-system
          # by Stakater Replicator. Levels 4-5 (app, appenv) are either provided by
          # the platform publisher ({app}-config / {app}-secrets) or by this chart
          # when secrets.managedByPlatform is false.
          # All entries are optional so pods start even when a level has no config.
          envFrom:
            # Level 1 — Org
            - configMapRef:
                name: suparship-envvars-org
                optional: true
            - secretRef:
                name: suparship-secrets-org-k8s
                optional: true
            # Level 2 — Environment (org-level per env type)
            - configMapRef:
                name: suparship-envvars-env-{{ .Values.app.env }}
                optional: true
            - secretRef:
                name: suparship-secrets-env-{{ .Values.app.env }}-k8s
                optional: true
            # Level 3 — Project
            - configMapRef:
                name: suparship-envvars-project
                optional: true
            - secretRef:
                name: suparship-secrets-project-k8s
                optional: true
            {{- if .Values.secrets.managedByPlatform }}
            # Levels 4+5 — Platform-managed: suparship publisher writes these to GitOps.
            # ConfigMap "{app.name}-config" holds merged app+env vars.
            # Secret "{app.name}-secrets" is materialised by ESO from the 1Password item.
            - configMapRef:
                name: {{ .Values.app.name }}-config
                optional: true
            - secretRef:
                name: {{ .Values.app.name }}-secrets
                optional: true
            {{- else }}
            # Level 4 — App (chart-managed legacy path — secrets.managedByPlatform=false)
            - configMapRef:
                name: suparship-envvars-app
                optional: true
            - secretRef:
                name: suparship-secrets-app-k8s
                optional: true
            # Level 5 — App Environment (most specific, wins all)
            - configMapRef:
                name: suparship-envvars-appenv
                optional: true
            - secretRef:
                name: suparship-secrets-appenv-k8s
                optional: true
            {{- end }}
          {{- if $web.env }}
          # ComponentSpec.Config: direct env entries — override all envFrom levels above.
          env:
            {{- range $k, $v := $web.env }}
            - name: {{ $k }}
              value: {{ $v | quote }}
            {{- end }}
          {{- end }}
{{- end }}
