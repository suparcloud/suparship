{{/*
  env-configmaps.yaml — creates ConfigMaps in the app namespace for the two
  lower hierarchy levels (App and App Environment). These hold the env vars
  baked into values.yaml at GitOps publish time.

  Upper levels (Org, Environment, Project) are replicated into this namespace
  automatically by Stakater Replicator from suparship-system and are NOT
  created here.

  This template is only rendered when secrets.managedByPlatform is false.
  When managedByPlatform is true (the default), suparship writes a single
  platform-managed ConfigMap named "{app.name}-config" to the GitOps repo
  and the deployment's envFrom references that name directly.

  ConfigMap names (fixed, referenced by envFrom in deployment.yaml):
    suparship-envvars-app    ← App level
    suparship-envvars-appenv ← App Environment level
*/}}
{{- if not .Values.secrets.managedByPlatform }}
{{- if .Values.envLayers }}
{{- if and .Values.envLayers.app .Values.envLayers.app.vars }}
apiVersion: v1
kind: ConfigMap
metadata:
  name: suparship-envvars-app
  labels:
    {{- include "web-service.labels" . | nindent 4 }}
    suparship.io/type: envvars
    suparship.io/level: app
data:
  {{- toYaml .Values.envLayers.app.vars | nindent 2 }}
---
{{- end }}
{{- if and .Values.envLayers.appEnv .Values.envLayers.appEnv.vars }}
apiVersion: v1
kind: ConfigMap
metadata:
  name: suparship-envvars-appenv
  labels:
    {{- include "web-service.labels" . | nindent 4 }}
    suparship.io/type: envvars
    suparship.io/level: app-environment
data:
  {{- toYaml .Values.envLayers.appEnv.vars | nindent 2 }}
{{- end }}
{{- end }}
{{- end }}
