{{/*
  env-externalsecrets.yaml — creates ExternalSecret CRs in the app namespace
  for the App and App Environment hierarchy levels. One ExternalSecret is
  created per (level, provider) pair so each backend uses its own
  ClusterSecretStore.

  This template is only rendered when secrets.managedByPlatform is false.
  When managedByPlatform is true (the default), suparship writes a single
  platform-managed ExternalSecret named "{app.name}-secrets" to the GitOps
  repo and the deployment's envFrom references that name directly.

  Upper levels (Org, Environment, Project) have their ExternalSecrets written
  to gitops-output/_infra/ by the suparship GitOps publisher and are NOT
  created here.

  Secret name pattern: suparship-secrets-{level}-{provider}
  e.g. suparship-secrets-app-k8s, suparship-secrets-appenv-vault

  ClusterSecretStore names:
    k8s    → suparship-k8s-store    (reads from suparship-system namespace)
    vault  → suparship-vault-store
    aws-sm → suparship-aws-sm-store
*/}}
{{- if not .Values.secrets.managedByPlatform }}
{{- $providers := list "k8s" "vault" "aws-sm" }}
{{- $storeNames := dict "k8s" "suparship-k8s-store" "vault" "suparship-vault-store" "aws-sm" "suparship-aws-sm-store" }}
{{- $levels := dict "app" ((.Values.envLayers).app) "appEnv" ((.Values.envLayers).appEnv) }}

{{- range $level, $layer := $levels }}
{{- if $layer }}
{{- range $provider := $providers }}
{{- $refs := list }}
{{- range ($layer.secretRefs | default list) }}
{{- if eq .provider $provider }}
{{- $refs = append $refs . }}
{{- end }}
{{- end }}
{{- if $refs }}
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: suparship-secrets-{{ $level | lower }}-{{ $provider }}
  labels:
    {{- include "web-service.labels" $ | nindent 4 }}
    suparship.io/type: external-secret
    suparship.io/level: {{ $level | lower }}
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: {{ index $storeNames $provider }}
    kind: ClusterSecretStore
  target:
    name: suparship-secrets-{{ $level | lower }}-{{ $provider }}
    creationPolicy: Owner
  data:
  {{- range $refs }}
  - secretKey: {{ .envKey }}
    remoteRef:
      key: {{ .name }}
      property: {{ .key }}
  {{- end }}
---
{{- end }}
{{- end }}
{{- end }}
{{- end }}
{{- end }}
