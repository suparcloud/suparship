{{- $web := .Values.components.web }}
{{- if and $web.enabled .Values.pdb.enabled }}
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: {{ include "web-service.fullname" . }}
  labels:
    {{- include "web-service.labels" . | nindent 4 }}
spec:
  # maxUnavailable (not minAvailable) so single-replica apps don't block node
  # drains: a PDB of minAvailable:1 over 1 replica makes every drain hang.
  maxUnavailable: {{ .Values.pdb.maxUnavailable | default 1 }}
  selector:
    matchLabels:
      {{- include "web-service.selectorLabels" . | nindent 6 }}
{{- end }}
