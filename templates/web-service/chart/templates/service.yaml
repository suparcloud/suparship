{{- $web := .Values.components.web }}
{{- if $web.enabled }}
apiVersion: v1
kind: Service
metadata:
  name: {{ include "web-service.fullname" . }}
  labels:
    {{- include "web-service.labels" . | nindent 4 }}
spec:
  type: ClusterIP
  ports:
    - port: {{ $web.port | default 80 }}
      targetPort: http
      protocol: TCP
      name: http
  selector:
    {{- include "web-service.selectorLabels" . | nindent 4 }}
{{- end }}
