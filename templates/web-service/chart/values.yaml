# Default values for the web-service template chart.
#
# Follows the suparship canonical HelmValues schema generated by
# internal/helmvalues/mapper.go. All keys under `components.web.*` and
# `routing.*` are set by suparship at publish time from the app spec;
# only default values need to be declared here.
#
# Chart is compatible with the suparship helmvalues schema:
#   components.<name>.image.{repository,tag}
#   components.<name>.replicas
#   components.<name>.expose
#   components.<name>.port
#   components.<name>.healthCheck.path
#   components.<name>.resources.size  (optional)
#   routing.host
#   routing.component

# -- App identity — injected by suparship at publish time.
app:
  name: ""
  env: ""

# -- Platform metadata — injected by suparship at publish time (identity +
# resolved routing context for this env/cluster). Reference any field via
# .Values.platform.* in your chart. Never contains secrets.
platform:
  org: ""
  project: ""
  app: ""
  env: ""
  envType: ""
  cluster: ""
  namespace: ""
  baseDomain: ""
  routingHost: ""
  ingressClassName: ""
  clusterIssuer: ""

# -- Per-component configuration managed by suparship.
components:
  web:
    enabled: true
    image:
      # Default to a working demo image. Users should set their own image.
      repository: nginx
      tag: "stable"
    replicas: 2
    expose: true
    # TCP port the container listens on.
    port: 80
    # HTTP path for liveness and readiness probes.
    healthCheck:
      path: /
    resources:
      # small | medium | large — maps to CPU/memory limits via the
      # suparship-common library helper.
      size: small

# -- Primary routing entry point. Set by suparship from environment config.
routing:
  host: ""
  component: web

# -- ServiceAccount configuration.
serviceAccount:
  create: true
  name: ""
  annotations: {}

# -- Stakater Reloader auto-restart on Secret/ConfigMap change.
# Set to "" to disable.
reloader: "true"

# -- PodDisruptionBudget: keep rollouts and node drains from taking the whole
# app down at once. maxUnavailable (never minAvailable) so a single-replica
# app can still be drained.
pdb:
  enabled: true
  maxUnavailable: 1

# -- Graceful shutdown. preStopSleepSeconds keeps the pod serving while
# endpoint controllers and load balancers drop it from rotation (0 disables);
# terminationGracePeriodSeconds must exceed the sleep + the app's own
# drain time.
preStopSleepSeconds: 15
terminationGracePeriodSeconds: 30

# -- envFrom hierarchy — populated by the suparship publisher per app-env.
# The chart suppresses the envFrom block when both lists are empty.
suparship:
  envFromConfigMaps: []
  envFromSecrets: []

# -- KEDA ScaledObject. Replaces the prior HPA v2 wiring (chart-conventions
# standardizes on KEDA across all app charts).
autoscaling:
  enabled: false
  minReplicaCount: 1
  maxReplicaCount: 10
  cooldownPeriod: 300
  pollingInterval: 30
  cpuTarget: 80
  memoryTarget: 90
  # Defaults to a cpu+memory utilization trigger built from cpuTarget /
  # memoryTarget. Set this list explicitly to override (e.g. cron, prometheus).
  triggers: []
  behavior:
    scaleDown:
      stabilizationWindowSeconds: 300
      policies:
        - type: Pods
          value: 1
          periodSeconds: 60
    scaleUp:
      stabilizationWindowSeconds: 60
      policies:
        - type: Pods
          value: 1
          periodSeconds: 30
