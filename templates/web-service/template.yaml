# suparship Template: web-service
#
# A general-purpose template for creating containerized HTTP apps on
# Kubernetes. Creates an app with a single web component (Deployment,
# Service, optional Ingress, and optional HPA). Designed to cover 80%
# of web app deployments with minimal configuration.
#
# Engine: Helm
# Chart:  ./chart

apiVersion: suparship.io/v1alpha1
kind: Template
metadata:
  name: web-service
  version: "1.0.0"
spec:
  title: Web App
  description: >-
    Create a containerized web app with a single web component. Includes
    a Kubernetes Service, optional Ingress, and optional horizontal
    autoscaling. Suitable for APIs, frontends, and general HTTP workloads.
  category: web
  engine:
    type: helm
    chart: ./chart

  components:
    - name: web
      type: web
      required: true
      defaultEnabled: true
      previewEnabled: true
      exposed: true
      produces: [Deployment, Service]
      optionallyProduces: [Ingress, ScaledObject]
      # All web defaults apply — expose=true, routing=ingress,
      # autoscaling=keda, pdb=true, resources=true, replicas=true.
      # No overrides needed; declared here for documentation only.
      capabilities: {}

  # The developer-facing values projection: the handful of Helm values a developer
  # owns. The app-creation editor seeds from exactly these keys (prefilled with
  # their current effective values) instead of the whole chart+platform base, so
  # everything else here and in defaultValues/envValues stays platform-owned and out
  # of the way.
  #
  # Required fields are seeded live; the rest are seeded commented-out showing what
  # they inherit, so an untouched value keeps tracking the chart default instead of
  # being pinned into the app's overlay.
  #
  # This is a VIEW, not an enforcement boundary — the editor's "Show all platform
  # values" escape hatch and the API both still accept any key.
  developerValues:
    - path: components.web.image.repository
      title: Image Repository
      type: string
      required: true
      description: Container image repository, e.g. ghcr.io/org/app or nginx.
    - path: components.web.port
      title: Container Port
      type: number
      default: 8080
      min: 1
      max: 65535
      description: TCP port the container listens on.
    - path: components.web.healthCheck.path
      title: Health Check Path
      type: string
      description: HTTP path for liveness and readiness probes.
    - path: components.web.resources.size
      title: Resource Size
      type: enum
      options:
        - small
        - medium
        - large
      # Kept short: each description line becomes a comment line in the developer's
      # seeded values, and YAML comments don't wrap.
      description: |-
        CPU/memory profile.
        small 250m/256Mi · medium 500m/512Mi · large 1/1Gi
    - path: components.web.replicas
      title: Replica Count
      type: number
      min: 1
      max: 20
      description: Pod replicas. Ignored when autoscaling is enabled.

  inputs:
    - name: service_name
      title: App Name
      type: string
      required: true
      description: >-
        Name for this app. Used in Kubernetes resource names,
        labels, and selectors. Must be DNS-compatible.
      pattern: "^[a-z][a-z0-9-]{0,61}[a-z0-9]$"

    - name: image_repository
      title: Image Repository
      type: string
      required: true
      description: >-
        Container image repository, e.g. ghcr.io/org/app or nginx.

    - name: image_tag
      title: Image Tag
      type: string
      default: "latest"
      description: >-
        Container image tag. Pin to a specific version or SHA for
        production deployments.

    - name: port
      title: Container Port
      type: number
      default: 8080
      min: 1
      max: 65535
      description: >-
        TCP port the container listens on.

    - name: ingress_enabled
      title: Enable Ingress
      type: boolean
      default: false
      description: >-
        Expose the service externally via an Ingress resource.

    - name: size
      title: Resource Size
      type: enum
      options:
        - small
        - medium
        - large
      default: small
      description: >-
        Resource profile for CPU and memory limits.
        small: 250m CPU / 256Mi — development and low traffic.
        medium: 500m CPU / 512Mi — moderate production workloads.
        large: 1 CPU / 1Gi — high-throughput services.

    - name: health_path
      title: Health Check Path
      type: string
      default: "/healthz"
      description: >-
        HTTP path for liveness and readiness probes.

  advancedInputs:
    - name: replicas
      title: Replica Count
      type: number
      default: 2
      min: 1
      max: 20
      description: >-
        Number of pod replicas. Ignored when autoscaling is enabled.

  secretInputs:
    - name: database_url
      title: Database URL
      description: >-
        Connection string for the primary database. Injected as an
        environment variable from a Kubernetes Secret.
      secretRef: db-credentials.url

  mappings:
    fullnameOverride: "{{ .inputs.service_name }}"
    image.repository: "{{ .inputs.image_repository }}"
    image.tag: "{{ .inputs.image_tag }}"
    replicaCount: "{{ .inputs.replicas }}"
    port: "{{ .inputs.port }}"
    ingress.enabled: "{{ .inputs.ingress_enabled }}"
    healthCheck.path: "{{ .inputs.health_path }}"
    size: "{{ .inputs.size }}"

  presets:
    - name: starter
      title: Starter
      description: >-
        Minimal footprint for development and experimentation.
        Single replica, small resources, no ingress.
      values:
        replicas: 1
        size: small
        ingress_enabled: false

    - name: production
      title: Production
      description: >-
        Production-ready defaults with multiple replicas, larger
        resources, and external ingress enabled.
      values:
        replicas: 3
        size: large
        ingress_enabled: true
