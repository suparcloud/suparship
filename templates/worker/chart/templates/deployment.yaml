{{- $worker := .Values.components.worker }}
{{- if $worker.enabled }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "worker.fullname" . }}
  labels:
    {{- include "worker.labels" . | nindent 4 }}
  annotations:
    {{- include "suparship-common.reloaderAnnotation" . | nindent 4 }}
spec:
  {{- if not .Values.autoscaling.enabled }}
  replicas: {{ $worker.replicas | default 1 }}
  {{- end }}
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  selector:
    matchLabels:
      {{- include "worker.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "worker.selectorLabels" . | nindent 8 }}
        {{- include "suparship-common.componentNameLabel" "worker" | nindent 8 }}
    spec:
      {{- if .Values.serviceAccount.create }}
      serviceAccountName: {{ include "worker.serviceAccountName" . }}
      {{- end }}
      # Workers drain on SIGTERM: finish in-flight work, stop pulling new
      # work, exit. The grace period is the drain budget — no preStop sleep,
      # since there is no traffic rotation to wait out.
      terminationGracePeriodSeconds: {{ .Values.terminationGracePeriodSeconds | default 60 }}
      containers:
        - name: {{ include "worker.fullname" . }}
          image: "{{ $worker.image.repository | default "busybox" }}:{{ $worker.image.tag | default "stable" }}"
          imagePullPolicy: IfNotPresent
          {{- with $worker.command }}
          command:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          {{- with $worker.args }}
          args:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          resources:
            {{- include "worker.resources" . | nindent 12 }}
          {{- include "suparship-common.envFrom" . | nindent 10 }}
          {{- if $worker.env }}
          # ComponentSpec.Config: direct env entries — override all envFrom levels above.
          env:
            {{- range $k, $v := $worker.env }}
            - name: {{ $k }}
              value: {{ $v | quote }}
            {{- end }}
          {{- end }}
{{- end }}
