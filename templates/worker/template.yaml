# suparship Template: worker
#
# A long-running background worker — queue consumer, event processor, outbox
# relay. No Service, no Ingress, no ports: a worker is defined by what it
# consumes, not what it serves. Scaling is KEDA-native — the interesting
# worker triggers are queue-length ones (set autoscaling.triggers via the
# values editor; the cpu/memory default is only a safe fallback).
#
# Set the container's command/args via the values editor
# (components.worker.command / components.worker.args) when the image's
# entrypoint isn't the worker loop itself.
#
# Engine: Helm
# Chart:  ./chart

apiVersion: suparship.io/v1alpha1
kind: Template
metadata:
  name: worker
  version: "1.0.0"
spec:
  title: Background Worker
  description: >-
    Deploy a long-running background worker — a queue consumer, event
    processor, or scheduler loop. No Service or Ingress; graceful drain on
    shutdown; optional KEDA autoscaling (wire a queue-length trigger for
    real worker scaling). Suitable for anything that pulls work rather than
    serving requests.
  category: worker
  engine:
    type: helm
    chart: ./chart

  components:
    - name: worker
      type: worker
      required: true
      defaultEnabled: true
      exposed: false
      produces: [Deployment, PodDisruptionBudget]
      optionallyProduces: [ScaledObject]
      capabilities: {}

  developerValues:
    - path: components.worker.image.repository
      title: Image Repository
      type: string
      required: true
      description: Container image repository, e.g. ghcr.io/org/app.
    - path: components.worker.replicas
      title: Replica Count
      type: number
      default: 1
      min: 1
      max: 50
      description: Worker replicas. Ignored when autoscaling is enabled.
    - path: components.worker.resources.size
      title: Resource Size
      type: enum
      options: [small, medium, large]
      description: |-
        CPU/memory profile.
        small 250m/256Mi · medium 500m/512Mi · large 1/1Gi
